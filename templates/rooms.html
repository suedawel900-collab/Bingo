<!DOCTYPE html>
<html>
<head>
    <title>MK-BINGO - Choose Room</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            text-align: center;
            position: relative;
        }
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #667eea;
            transition: transform 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .back-arrow:hover {
            transform: translateX(-5px);
            color: #764ba2;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 36px;
        }
        .balance {
            font-size: 20px;
            color: #4CAF50;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .rooms {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .room-card {
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
            border: 2px solid #667eea;
            border-radius: 15px;
            padding: 25px 20px;
            width: 260px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
        }
        .room-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(102,126,234,0.4);
        }
        .room-card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 28px;
        }
        .room-card .pattern {
            color: #555;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .room-card .price {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
            margin: 15px 0;
        }
        .room-card .start-type {
            background: #ff9800;
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            display: inline-block;
            font-size: 14px;
            font-weight: bold;
        }
        .room-card.room2 .start-type {
            background: #9c27b0;
        }
        .footer {
            margin-top: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://t.me/{{ bot_username }}" class="back-arrow" title="Back to Telegram">←</a>
        
        <h1>🎯 MK-BINGO</h1>
        <div class="balance">💰 ቀሪ ሂሳብ: <span id="balance">{{ balance }}</span> ብር</div>
        
        <div class="rooms">
            <!-- Room 1 - Any Line -->
            <div class="room-card" onclick="selectRoom(1)">
                <h2>🚪 ክፍል 1</h2>
                <div class="pattern">አንድ መስመር</div>
                <div class="price">10 ብር በካርድ</div>
                <div class="start-type">⏱️ ከ5 ካርዶች በኋላ ይጀምራል</div>
            </div>
            
            <!-- Room 2 - Full House 100 Birr -->
            <div class="room-card room2" onclick="selectRoom(2)">
                <h2>🚪 ክፍል 2</h2>
                <div class="pattern">ፉል ሃውስ</div>
                <div class="price">100 ብር በካርድ</div>
                <div class="start-type">👑 በአስተዳዳሪ ይጀምራል</div>
            </div>
            
            <!-- Room 3 - Full House 20 Birr -->
            <div class="room-card" onclick="selectRoom(3)">
                <h2>🚪 ክፍል 3</h2>
                <div class="pattern">ፉል ሃውስ</div>
                <div class="price">20 ብር በካርድ</div>
                <div class="start-type">⏱️ ከ5 ካርዶች በኋላ ይጀምራል</div>
            </div>
        </div>
        
        <div class="footer">መልካም እድል! 🍀</div>
    </div>

    <script>
        const userId = {{ user_id }};
        const botUsername = "{{ bot_username }}";
        
        function selectRoom(roomId) {
            window.location.href = `/game?user_id=${userId}&game_id=${roomId}`;
        }
    </script>
</body>
</html>
