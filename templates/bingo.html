<script>
    // Configuration
    const userId = parseInt('{{ user_id }}');
    const gameId = parseInt('{{ game_id }}');
    const adminId = '{{ admin_id }}';
    const pricePerCard = {{ price_per_card }};
    const maxCards = {{ max_cards }};
    const isAdmin = (userId == adminId);
    
    // Game settings
    const TOTAL_NUMBERS = 75;
    const ROUND_TIME = 120;
    const CARD_PRICE = pricePerCard * 100;
    
    // State
    let ws = null;
    let selectedCards = [];
    let myCards = {};
    let marked = {};
    let called = [];
    let players = [];
    let takenCards = new Set();
    let gameStarted = false;
    let currentRound = 1;
    let currentWinner = null;
    let currentCardIndex = 0;
    let balance = {{ initial_balance }};
    let activeGames = {{ initial_active_games }};
    let totalStake = {{ initial_stake }};
    let prizePool = 0;
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 5;
    let isReady = false;
    
    // Auto-daub flag
    let autoDaubEnabled = false;
    
    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
        loadCards();
        connectWebSocket();
        fetchBalance();
    });
    
    if (isAdmin) {
        document.getElementById('admin-controls').style.display = 'block';
        document.getElementById('status').className = 'status admin';
        document.getElementById('status').textContent = '👑 ADMIN';
    }
    
    // Fetch user balance
    async function fetchBalance() {
        try {
            const response = await fetch(`/api/user/${userId}`);
            const data = await response.json();
            if (data) {
                balance = data.balance_etb || balance;
                activeGames = data.active_games || activeGames;
                totalStake = data.total_stake_etb || totalStake;
                updateWallet();
            }
        } catch (e) {
            console.error('Error fetching balance:', e);
        }
    }
    
    // Update wallet display
    function updateWallet() {
        document.getElementById('wallet-balance').textContent = `${balance.toFixed(2)} ETB`;
        document.getElementById('active-games').textContent = activeGames;
        document.getElementById('total-stake').textContent = `${totalStake.toFixed(2)} ETB`;
    }
    
    // Calculate prize pool
    function calculatePrizePool() {
        const readyPlayers = players.filter(p => p.card_count > 0);
        let totalCards = 0;
        readyPlayers.forEach(p => totalCards += p.card_count);
        prizePool = totalCards * pricePerCard;
        
        document.getElementById('prize-pool').textContent = `${prizePool.toFixed(2)} ETB`;
        document.getElementById('game-prize').textContent = `${prizePool.toFixed(2)} ETB`;
        
        return prizePool;
    }
    
    // WebSocket connection
    function connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/${gameId}/${userId}`;
        
        console.log('Connecting to WebSocket:', wsUrl);
        ws = new WebSocket(wsUrl);
        
        ws.onopen = function() {
            console.log('✅ WebSocket connected');
            reconnectAttempts = 0;
            document.getElementById('reconnect-bar').style.display = 'none';
            showMessage('Connected!', 'success');
            
            setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, 30000);
        };
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log('📩 Received:', data.type, data);
            
            if (data.type === 'connected') {
                takenCards = new Set(data.taken_cards || []);
                players = data.players || [];
                currentRound = data.round || 1;
                gameStarted = data.game_started || false;
                called = data.called_numbers || [];
                
                document.getElementById('active-game-display').textContent = `Round ${currentRound}`;
                calculatePrizePool();
                updateCalledNumbersList();
                updateCardGrid();
                updatePlayersList();
                updateReadyCount();
                
                // Check if we were already in a game (have cards)
                const playerData = players.find(p => p.id == userId);
                if (playerData && playerData.card_count > 0) {
                    isReady = true;
                    document.getElementById('status').className = 'status ready';
                    document.getElementById('status').textContent = '✅ READY';
                    document.getElementById('selection').style.opacity = '0.7';
                    document.getElementById('selection').style.pointerEvents = 'none';
                    document.getElementById('confirm-btn').disabled = true;
                    document.getElementById('confirm-btn').textContent = '✓ READY';
                    
                    // Show game screen if game is active
                    if (gameStarted) {
                        showGameScreen();
                        document.getElementById('timer-container').style.display = 'block';
                        document.getElementById('bingo-btn').disabled = false;
                    }
                }
                
                if (gameStarted) {
                    showGameScreen();
                    document.getElementById('timer-container').style.display = 'block';
                    document.getElementById('bingo-btn').disabled = false;
                }
            }
            else if (data.type === 'player_joined') {
                players = data.players || [];
                takenCards = new Set(data.taken_cards || []);
                calculatePrizePool();
                updatePlayersList();
                updateCardGrid();
                updateReadyCount();
            }
            else if (data.type === 'card_taken') {
                takenCards = new Set(data.taken_cards || []);
                updateCardGrid();
            }
            else if (data.type === 'cards_selected') {
                if (data.success) {
                    showMessage(`✅ ${data.message}`, 'success');
                    // After selecting cards, automatically finalize
                    setTimeout(() => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'finalize' }));
                        }
                    }, 500);
                } else {
                    showMessage(`❌ ${data.message}`, 'error');
                }
            }
            else if (data.type === 'your_card') {
                myCards[data.card_id] = data.card;
                if (data.marked) {
                    marked[data.card_id] = data.marked;
                } else {
                    marked[data.card_id] = [];
                }
                updateSelectedDisplay();
                
                // If we have cards and game is active, show game screen
                if (Object.keys(myCards).length > 0 && gameStarted) {
                    showGameScreen();
                }
            }
            else if (data.type === 'finalized') {
                if (data.success) {
                    isReady = true;
                    showMessage('✅ Ready to play! Waiting for admin to start...', 'success');
                    document.getElementById('confirm-btn').disabled = true;
                    document.getElementById('confirm-btn').textContent = '✓ READY';
                    document.getElementById('status').className = 'status ready';
                    document.getElementById('status').textContent = '✅ READY';
                    
                    // Update balance after deduction
                    if (data.new_balance) {
                        balance = data.new_balance;
                        updateWallet();
                    }
                    
                    // Show game screen but keep selection visible until game starts
                    document.getElementById('selection').style.opacity = '0.7';
                    document.getElementById('selection').style.pointerEvents = 'none';
                } else {
                    showMessage(`❌ ${data.message}`, 'error');
                }
            }
            else if (data.type === 'stats_update') {
                balance = data.balance;
                activeGames = data.active_games;
                totalStake = data.total_stake;
                updateWallet();
            }
            else if (data.type === 'game_started') {
                gameStarted = true;
                currentRound = data.round || currentRound;
                document.getElementById('active-game-display').textContent = `Round ${currentRound}`;
                document.getElementById('status').className = 'status playing';
                document.getElementById('status').textContent = '🎮 PLAYING';
                document.getElementById('bingo-btn').disabled = false;
                document.getElementById('timer-container').style.display = 'block';
                document.getElementById('last-number').textContent = '🎲 Game Started!';
                
                // Show game screen fully
                showGameScreen();
                
                showMessage('🚀 Game started!', 'success');
            }
            else if (data.type === 'player_ready') {
                players = data.players || [];
                calculatePrizePool();
                updatePlayersList();
                updateReadyCount();
                
                // Check if we are ready
                const playerData = players.find(p => p.id == userId);
                if (playerData && playerData.ready) {
                    isReady = true;
                    document.getElementById('status').className = 'status ready';
                    document.getElementById('status').textContent = '✅ READY';
                }
                
                // Update start button for admin
                if (isAdmin) {
                    const readyCount = players.filter(p => p.ready).length;
                    const startBtn = document.getElementById('start-game-btn');
                    if (readyCount > 0) {
                        startBtn.classList.add('ready');
                        startBtn.disabled = false;
                    } else {
                        startBtn.classList.remove('ready');
                        startBtn.disabled = true;
                    }
                }
            }
            else if (data.type === 'game_active') {
                // Update called numbers on reconnect
                if (data.called_numbers) {
                    called = data.called_numbers;
                    updateCalledNumbersList();
                    document.getElementById('numbers-left').textContent = 
                        `${TOTAL_NUMBERS - called.length} numbers left`;
                }
                if (data.last_number) {
                    document.getElementById('last-number').textContent = `🎲 ${data.last_number}`;
                }
            }
            else if (data.type === 'player_reconnected') {
                players = data.players || [];
                updatePlayersList();
                updateReadyCount();
                showMessage(`👋 Reconnected to game`, 'info');
            }
            else if (data.type === 'number_called') {
                called = data.called || [];
                document.getElementById('last-number').textContent = `🎲 ${data.number}`;
                document.getElementById('numbers-left').textContent = `${data.left} numbers left`;
                updateCalledNumbersList();
                
                if (autoDaubEnabled && data.number && data.number !== 'FREE') {
                    autoMarkNumber(data.number);
                }
            }
            else if (data.type === 'number_marked') {
                if (marked[data.card_id]) {
                    marked[data.card_id].push(data.number);
                }
                renderCurrentCard();
            }
            else if (data.type === 'game_won') {
                gameStarted = false;
                currentWinner = data.winner;
                
                document.getElementById('status').className = 'status winner';
                document.getElementById('status').textContent = '🏆 WINNER!';
                document.getElementById('bingo-btn').disabled = true;
                document.getElementById('timer-container').style.display = 'none';
                
                const winnerDiv = document.getElementById('winner-announcement');
                winnerDiv.style.display = 'block';
                winnerDiv.innerHTML = `
                    🏆 WINNER! 🏆<br>
                    ${data.winner.name} with Card #${data.winner.card_id}<br>
                    Prize: ${data.prize} ETB
                `;
                
                showMessage(`🏆 ${data.winner.name} won!`, 'success');
                
                if (isAdmin) {
                    document.getElementById('start-game-btn').style.display = 'block';
                    document.getElementById('start-game-btn').textContent = '🚀 START NEXT ROUND';
                }
                
                fetchBalance();
            }
            else if (data.type === 'game_reset') {
                resetForNewRound();
                players = data.players || [];
                calculatePrizePool();
                updatePlayersList();
                showMessage(`🔄 Round ${currentRound} ended! Select cards for next round.`, 'info');
            }
            else if (data.type === 'start_result') {
                if (data.success) {
                    showMessage('✅ Game started!', 'success');
                } else {
                    showMessage(`❌ ${data.message}`, 'error');
                }
            }
            else if (data.type === 'countdown') {
                const minutes = Math.floor(data.time / 60);
                const seconds = data.time % 60;
                document.getElementById('timer').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
            else if (data.type === 'error') {
                showMessage(`❌ ${data.message}`, 'error');
            }
            else if (data.type === 'pong') {
                console.log('🏓 Pong received');
            }
        };
        
        ws.onclose = function() {
            console.log('❌ WebSocket disconnected');
            document.getElementById('reconnect-bar').style.display = 'block';
            
            if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                showMessage(`Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})`, 'info');
                setTimeout(connectWebSocket, 2000 * reconnectAttempts);
            } else {
                showMessage('Unable to connect to server', 'error');
            }
        };
        
        ws.onerror = function(error) {
            console.error('WebSocket error:', error);
            showMessage('Connection error', 'error');
        };
    }
    
    function manualReconnect() {
        showMessage('🔄 Attempting to reconnect...', 'info');
        document.getElementById('reconnect-bar').style.display = 'none';
        reconnectAttempts = 0;
        connectWebSocket();
    }
    
    // Auto-mark a number on all cards
    function autoMarkNumber(number) {
        if (!gameStarted) return;
        const num = parseInt(number);
        if (isNaN(num)) return;
        
        Object.keys(myCards).forEach(cardId => {
            const card = myCards[cardId];
            let found = false;
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    if (card[col][row] === num && !marked[cardId].includes(num)) {
                        found = true;
                        break;
                    }
                }
            }
            if (found) {
                ws.send(JSON.stringify({
                    type: 'mark_number',
                    card_id: parseInt(cardId),
                    number: num
                }));
            }
        });
    }
    
    // Toggle auto-daub
    function toggleAutoDaub() {
        autoDaubEnabled = document.getElementById('autoDaub').checked;
        showMessage(autoDaubEnabled ? 'Auto-mark ON' : 'Auto-mark OFF', 'info');
    }
    
    // Manual refresh
    function manualRefresh() {
        showMessage('Refreshing...', 'info');
        try {
            fetch(`/api/game-state/${gameId}`)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        players = data.players || players;
                        called = data.called_numbers || called;
                        gameStarted = data.started;
                        calculatePrizePool();
                        updatePlayersList();
                        updateReadyCount();
                        updateCalledNumbersList();
                        showMessage('Refreshed!', 'success');
                    }
                });
        } catch (e) {
            showMessage('Refresh failed, reconnecting...', 'error');
            connectWebSocket();
        }
    }
    
    // Update called numbers list
    function updateCalledNumbersList() {
        const container = document.getElementById('called-numbers-list');
        container.innerHTML = '';
        
        called.forEach(num => {
            const badge = document.createElement('span');
            badge.className = 'called-badge';
            badge.textContent = num;
            container.appendChild(badge);
        });
        
        document.getElementById('numbers-left').textContent = `${TOTAL_NUMBERS - called.length} numbers left`;
    }
    
    // Load available cards
    async function loadCards() {
        const grid = document.getElementById('card-grid');
        grid.innerHTML = '<div class="loading">Loading 1000 cards</div>';
        
        try {
            grid.innerHTML = '';
            
            for (let i = 1; i <= 100; i++) {
                const btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.textContent = i;
                btn.onclick = () => toggleCardSelection(i);
                grid.appendChild(btn);
                
                if (i % 100 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
            }
            
            updateCardGrid();
        } catch (error) {
            console.error('Error loading cards:', error);
            grid.innerHTML = '<div class="error">Error loading cards</div>';
        }
    }
    
    // Toggle card selection
    function toggleCardSelection(cardId) {
        if (gameStarted) {
            showMessage('❌ Game already started!', 'error');
            return;
        }
        
        if (isReady) {
            showMessage('❌ Already confirmed! Wait for next round.', 'error');
            return;
        }
        
        if (takenCards.has(cardId) && !selectedCards.includes(cardId)) {
            showMessage(`❌ Card #${cardId} is taken!`, 'error');
            return;
        }
        
        const index = selectedCards.indexOf(cardId);
        if (index >= 0) {
            selectedCards.splice(index, 1);
        } else {
            if (selectedCards.length >= maxCards) {
                showMessage(`❌ Maximum ${maxCards} cards allowed`, 'error');
                return;
            }
            selectedCards.push(cardId);
        }
        
        selectedCards.sort((a, b) => a - b);
        
        updateSelectedDisplay();
        updateCardGrid();
    }
    
    // Update selected cards display
    function updateSelectedDisplay() {
        const panel = document.getElementById('selected-panel');
        const badges = document.getElementById('selected-badges');
        const totalCost = document.getElementById('total-cost');
        const confirmBtn = document.getElementById('confirm-btn');
        const clearBtn = document.getElementById('clear-btn');
        
        if (selectedCards.length > 0) {
            panel.style.display = 'block';
            clearBtn.style.display = 'block';
            
            badges.innerHTML = '';
            selectedCards.forEach(id => {
                const badge = document.createElement('span');
                badge.className = 'card-badge';
                badge.innerHTML = `#${id} <button class="remove-card" onclick="removeCard(${id})">✕</button>`;
                badges.appendChild(badge);
            });
            
            const cost = selectedCards.length * pricePerCard;
            totalCost.textContent = `Total: ${cost.toFixed(2)} ETB`;
            
            if (cost <= balance) {
                confirmBtn.disabled = false;
                confirmBtn.textContent = `Confirm (${cost.toFixed(2)} ETB)`;
            } else {
                confirmBtn.disabled = true;
                confirmBtn.textContent = `Insufficient (${cost.toFixed(2)} ETB)`;
            }
        } else {
            panel.style.display = 'none';
            clearBtn.style.display = 'none';
            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Confirm (0 ETB)';
        }
        
        updateCardGrid();
    }
    
    function removeCard(cardId) {
        if (isReady) {
            showMessage('❌ Already confirmed!', 'error');
            return;
        }
        const index = selectedCards.indexOf(cardId);
        if (index >= 0) {
            selectedCards.splice(index, 1);
            updateSelectedDisplay();
        }
    }
    
    function clearSelection() {
        if (isReady) {
            showMessage('❌ Already confirmed!', 'error');
            return;
        }
        selectedCards = [];
        updateSelectedDisplay();
    }
    
    function finalizeSelection() {
        if (selectedCards.length === 0) {
            showMessage('❌ Select at least one card', 'error');
            return;
        }
        
        if (isReady) {
            showMessage('❌ Already confirmed!', 'error');
            return;
        }
        
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            showMessage('❌ Not connected', 'error');
            connectWebSocket();
            return;
        }
        
        showMessage('⏳ Sending card selection...', 'info');
        
        ws.send(JSON.stringify({
            type: 'select_cards',
            card_ids: selectedCards
        }));
    }
    
    // Show game screen
    function showGameScreen() {
        document.getElementById('selection').style.opacity = '1';
        document.getElementById('selection').style.pointerEvents = 'auto';
        document.getElementById('game').style.display = 'block';
        
        const cardListDiv = document.getElementById('card-list');
        cardListDiv.innerHTML = '';
        
        const cardIds = Object.keys(myCards).sort((a, b) => parseInt(a) - parseInt(b));
        cardIds.forEach((id, index) => {
            const item = document.createElement('div');
            item.className = 'card-list-item';
            if (currentWinner && currentWinner.card_id == id) {
                item.classList.add('winner');
            }
            if (isReady) {
                item.classList.add('ready');
            }
            item.textContent = `Card #${id}`;
            item.dataset.index = index;
            item.onclick = () => switchCard(index);
            cardListDiv.appendChild(item);
        });
        
        if (cardIds.length > 0) {
            switchCard(0);
        }
        
        updateNavButtons();
        
        document.getElementById('game-players').textContent = players.filter(p => p.card_count > 0).length;
    }
    
    // Navigate cards
    function navigateCard(direction) {
        const cardIds = Object.keys(myCards).sort((a, b) => parseInt(a) - parseInt(b));
        if (cardIds.length === 0) return;
        let newIndex = currentCardIndex + direction;
        if (newIndex < 0) newIndex = 0;
        if (newIndex >= cardIds.length) newIndex = cardIds.length - 1;
        if (newIndex !== currentCardIndex) {
            switchCard(newIndex);
        }
    }
    
    // Switch displayed card
    function switchCard(index) {
        const cardIds = Object.keys(myCards).sort((a, b) => parseInt(a) - parseInt(b));
        if (cardIds.length === 0) return;
        if (index < 0 || index >= cardIds.length) return;
        
        currentCardIndex = index;
        
        document.querySelectorAll('.card-list-item').forEach((item, i) => {
            if (i === index) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
        
        renderCurrentCard();
        updateNavButtons();
    }
    
    function updateNavButtons() {
        const cardIds = Object.keys(myCards).sort((a, b) => parseInt(a) - parseInt(b));
        document.getElementById('prevCardBtn').disabled = (currentCardIndex <= 0);
        document.getElementById('nextCardBtn').disabled = (currentCardIndex >= cardIds.length - 1);
    }
    
    // Render current card
    function renderCurrentCard() {
        const cardIds = Object.keys(myCards).sort((a, b) => parseInt(a) - parseInt(b));
        if (cardIds.length === 0) return;
        
        const cardId = cardIds[currentCardIndex];
        const card = myCards[cardId];
        const markedNumbers = marked[cardId] || [];
        
        document.getElementById('current-card-title').innerHTML = `Card #${cardId}`;
        
        const cardDiv = document.getElementById('card-display');
        cardDiv.innerHTML = '';
        
        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
                const cell = document.createElement('div');
                cell.className = 'card-cell';
                const num = card[col][row];
                cell.textContent = num;
                
                if (num === 'FREE') {
                    cell.classList.add('free', 'marked');
                } else if (markedNumbers.includes(num)) {
                    cell.classList.add('marked');
                }
                
                cell.onclick = () => markNumber(parseInt(cardId), num);
                cardDiv.appendChild(cell);
            }
        }
    }
    
    function markNumber(cardId, num) {
        if (!gameStarted || num === 'FREE') return;
        if (!called.includes(num)) {
            showMessage(`❌ Number ${num} not called yet`, 'error');
            return;
        }
        
        if (marked[cardId] && marked[cardId].includes(num)) return;
        
        ws.send(JSON.stringify({
            type: 'mark_number',
            card_id: cardId,
            number: num
        }));
    }
    
    function checkBingo() {
        if (!gameStarted) return;
        if (Object.keys(myCards).length === 0) return;
        const currentCardId = parseInt(Object.keys(myCards)[currentCardIndex]);
        ws.send(JSON.stringify({
            type: 'claim_bingo',
            card_id: currentCardId
        }));
        showMessage('🎯 BINGO claimed! Server will validate...', 'info');
    }
    
    // Admin functions
    function callNumber() {
        if (!isAdmin) return;
        const number = parseInt(document.getElementById('call-number').value);
        if (number < 1 || number > 75) {
            showMessage('Enter a number between 1 and 75', 'error');
            return;
        }
        ws.send(JSON.stringify({ type: 'call_number', number: number }));
        document.getElementById('call-number').value = '';
    }
    
    function startGame() {
        if (!isAdmin) return;
        
        const readyPlayers = players.filter(p => p.ready).length;
        if (readyPlayers === 0) {
            showMessage('❌ No players ready!', 'error');
            return;
        }
        
        calculatePrizePool();
        showMessage(`💰 Prize pool: ${prizePool.toFixed(2)} ETB from ${readyPlayers} players`, 'info');
        ws.send(JSON.stringify({type: 'start_game'}));
    }
    
    function updateCardGrid() {
        document.querySelectorAll('.card-btn').forEach(btn => {
            const id = parseInt(btn.textContent);
            btn.classList.remove('taken', 'selected');
            
            if (takenCards.has(id) && !selectedCards.includes(id)) {
                btn.classList.add('taken');
            }
            if (selectedCards.includes(id)) {
                btn.classList.add('selected');
            }
        });
    }
    
    function updateReadyCount() {
        const ready = players.filter(p => p.ready).length;
        document.getElementById('ready-count').textContent = ready;
        document.getElementById('total-players').textContent = players.length;
        document.getElementById('game-players').textContent = ready;
        
        // Update start button for admin
        if (isAdmin) {
            const startBtn = document.getElementById('start-game-btn');
            if (ready > 0) {
                startBtn.classList.add('ready');
                startBtn.disabled = false;
            } else {
                startBtn.classList.remove('ready');
                startBtn.disabled = true;
            }
        }
    }
    
    function updatePlayersList() {
        const list = document.getElementById('players-list');
        list.innerHTML = '';
        
        players.forEach(p => {
            const badge = document.createElement('span');
            badge.className = 'player-badge';
            if (p.winner) badge.classList.add('winner');
            if (p.ready) badge.classList.add('ready');
            
            badge.textContent = `${p.name} (${p.card_count})`;
            if (p.id == userId) badge.textContent += ' (You)';
            
            list.appendChild(badge);
        });
    }
    
    function resetForNewRound() {
        selectedCards = [];
        myCards = {};
        marked = {};
        called = [];
        gameStarted = false;
        currentWinner = null;
        isReady = false;
        
        document.getElementById('selection').style.display = 'block';
        document.getElementById('selection').style.opacity = '1';
        document.getElementById('selection').style.pointerEvents = 'auto';
        document.getElementById('game').style.display = 'none';
        document.getElementById('timer-container').style.display = 'none';
        document.getElementById('status').className = 'status waiting';
        document.getElementById('status').textContent = '⏳ WAITING FOR ADMIN';
        document.getElementById('last-number').textContent = '🎲 Select cards and confirm to start...';
        
        updateSelectedDisplay();
        
        showMessage('🔄 New round! Select your cards again.', 'info');
    }
    
    function showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.className = `message ${type}`;
        setTimeout(() => {
            msg.style.display = 'none';
        }, 3000);
    }
</script>
