<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trustbot BINGO · 1000 Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #0f2a3f;
            display: flex;
            justify-content: center;
            padding: 16px 10px;
            min-height: 100vh;
        }
        .game-container {
            max-width: 480px;
            width: 100%;
            background: #1a3347;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            border: 1px solid #3f5e7a;
            height: fit-content;
        }
        .header {
            background: #0f2535;
            padding: 18px 16px 12px;
            text-align: center;
            border-bottom: 1px solid #2d4b64;
        }
        .header h1 {
            color: white;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .header h1 span {
            color: #ffd966;
        }
        .header p {
            color: #a5c4e0;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .status-badge {
            display: inline-block;
            background: #f39c12;
            color: #1e2e3f;
            font-weight: 800;
            font-size: 14px;
            padding: 5px 24px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-badge.admin {
            background: #f1c40f;
            box-shadow: 0 0 0 2px #ffe484;
        }

        /* Wallet row */
        .wallet-row {
            background: #0b1d2b;
            display: flex;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid #2c4459;
        }
        .wallet-item {
            text-align: center;
        }
        .wallet-label {
            color: #8ba9cc;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .wallet-value {
            color: white;
            font-weight: 800;
            font-size: 20px;
        }
        .wallet-value.green { color: #4ade80; }
        .wallet-value.blue { color: #60a5fa; }
        .wallet-value.orange { color: #fb923c; }

        /* Round & Prize bar */
        .round-prize-bar {
            background: #1e3f5c;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2f5a7a;
        }
        .round {
            color: white;
            font-weight: 700;
            font-size: 16px;
        }
        .prize {
            background: #f1c40f;
            color: #1e2f3f;
            font-weight: 900;
            font-size: 20px;
            padding: 4px 20px;
            border-radius: 40px;
        }

        /* Ready bar */
        .ready-bar {
            background: #1b4b6e;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            border-bottom: 1px solid #2c6a8f;
        }
        .ready-count {
            background: #2c6c9c;
            padding: 2px 22px;
            border-radius: 40px;
            font-size: 24px;
            font-weight: 900;
        }

        /* Content */
        .content {
            background: #ecf3fa;
            padding: 20px 16px;
        }
        .pick-title {
            font-size: 24px;
            font-weight: 800;
            color: #0f2a3f;
            margin-bottom: 2px;
        }
        .price-info {
            color: #2e4a6b;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        /* Selected cards panel */
        .selected-panel {
            background: #fff7e5;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 18px;
            border: 2px solid #f1c40f;
        }
        .selected-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: #b85e00;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .selected-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
            max-height: 70px;
            overflow-y: auto;
        }
        .card-badge {
            background: #f39c12;
            color: #1e2f3f;
            padding: 4px 10px 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .remove-card {
            background: rgba(0,0,0,0.2);
            border: none;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .total-cost {
            font-weight: 800;
            color: #b85e00;
            font-size: 16px;
            text-align: right;
            border-top: 1px dashed #f1c40f;
            padding-top: 8px;
        }

        /* Card Grid - 1000 cards */
        .card-grid-container {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            border: 2px solid #b3c9e0;
            max-height: 300px;
            overflow-y: auto;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
        }
        .card-btn {
            aspect-ratio: 1/1;
            background: #3a6ea5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        .card-btn.taken {
            background: #7f8c8d;
            opacity: 0.5;
            cursor: not-allowed;
        }
        .card-btn.selected {
            background: #2e7d32;
            box-shadow: 0 0 0 3px gold;
            transform: scale(1.02);
        }
        .card-btn:hover:not(.taken) {
            background: #2d5a88;
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
        }
        .action-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 40px;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .confirm-btn {
            background: #2e7d32;
            color: white;
        }
        .confirm-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .clear-btn {
            background: #c0392b;
            color: white;
        }

        .message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 30px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        .message.show {
            display: block;
        }
        .message.success { background: #b9f6ca; color: #1b5e20; }
        .message.error { background: #ffcdd2; color: #b71c1c; }
    </style>
</head>
<body>
<div class="game-container" id="app">
    <div class="header">
        <h1>BINGO · <span>1000</span></h1>
        <p>Game <span id="game-id">1</span> | Player <span id="player-id">7222251017</span></p>
        <div id="status" class="status-badge">WAITING</div>
    </div>

    <!-- Wallet Row -->
    <div class="wallet-row">
        <div class="wallet-item">
            <div class="wallet-label">WALLET</div>
            <div class="wallet-value green" id="wallet">610.00 ETB</div>
        </div>
        <div class="wallet-item">
            <div class="wallet-label">ACTIVE</div>
            <div class="wallet-value blue" id="active">0</div>
        </div>
        <div class="wallet-item">
            <div class="wallet-label">STAKE</div>
            <div class="wallet-value orange" id="stake">0.00 ETB</div>
        </div>
    </div>

    <!-- Round & Prize -->
    <div class="round-prize-bar">
        <span class="round">ROUND 1</span>
        <span class="prize" id="prize">30.00 ETB</span>
    </div>

    <!-- Ready -->
    <div class="ready-bar">
        <span>READY</span>
        <span class="ready-count" id="ready">2</span>
    </div>

    <!-- Main Content -->
    <div class="content">
        <h2 class="pick-title">Pick cards (max 20)</h2>
        <p class="price-info">10 ETB each · one round only</p>

        <!-- Selected Cards Panel (hidden initially) -->
        <div id="selectedPanel" class="selected-panel" style="display: none;">
            <div class="selected-header">
                <span>Your cards:</span>
                <span id="selectedCount">0/20</span>
            </div>
            <div id="selectedBadges" class="selected-badges"></div>
            <div id="totalCost" class="total-cost">Total: 0.00 ETB</div>
        </div>

        <!-- 1000 CARD GRID -->
        <div class="card-grid-container">
            <div id="cardGrid" class="card-grid"></div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="clearBtn" class="action-btn clear-btn" onclick="clearSelection()" style="display: none;">CLEAR</button>
            <button id="confirmBtn" class="action-btn confirm-btn" onclick="confirmSelection()" disabled>✔ Confirm (0 ETB)</button>
        </div>

        <!-- Message -->
        <div id="message" class="message"></div>
    </div>
</div>

<script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user_id') || '7222251017';
    const gameId = urlParams.get('game_id') || '1';
    const adminId = urlParams.get('admin_id') || '8741250511';
    
    // Update UI with params
    document.getElementById('player-id').textContent = userId;
    document.getElementById('game-id').textContent = gameId;
    
    // Check if current user is admin
    const isAdmin = (userId === adminId);
    const statusDiv = document.getElementById('status');
    if (isAdmin) {
        statusDiv.textContent = 'ADMIN';
        statusDiv.classList.add('admin');
    } else {
        statusDiv.textContent = 'WAITING';
    }
    
    // Game state
    const PRICE_PER_CARD = 10;
    const MAX_CARDS = 20;
    let balance = 610.00;
    let selectedCards = [];
    
    // Mock taken cards (cards already bought by other players)
    let takenCards = new Set([5, 12, 18, 23, 27, 31, 42, 56, 63, 78, 84, 91, 105, 118, 127, 133, 149, 152, 168, 173, 189, 194, 210]);
    
    // Initialize grid with 1000 cards
    function initCardGrid() {
        const grid = document.getElementById('cardGrid');
        grid.innerHTML = '';
        
        for (let i = 1; i <= 1000; i++) {
            const btn = document.createElement('button');
            btn.className = 'card-btn';
            if (takenCards.has(i)) {
                btn.classList.add('taken');
            }
            btn.textContent = i;
            btn.onclick = () => toggleCard(i);
            grid.appendChild(btn);
        }
    }
    
    // Toggle card selection
    function toggleCard(cardId) {
        if (takenCards.has(cardId)) {
            showMessage(`Card #${cardId} is already taken`, 'error');
            return;
        }
        
        const index = selectedCards.indexOf(cardId);
        if (index > -1) {
            // Remove from selection
            selectedCards.splice(index, 1);
        } else {
            // Add to selection (if under max)
            if (selectedCards.length >= MAX_CARDS) {
                showMessage(`Maximum ${MAX_CARDS} cards allowed`, 'error');
                return;
            }
            selectedCards.push(cardId);
        }
        
        // Sort selected cards
        selectedCards.sort((a, b) => a - b);
        
        // Update UI
        updateSelectedDisplay();
        updateGridHighlight();
    }
    
    // Update grid highlighting
    function updateGridHighlight() {
        const buttons = document.querySelectorAll('.card-btn');
        buttons.forEach(btn => {
            const id = parseInt(btn.textContent);
            btn.classList.remove('selected');
            if (selectedCards.includes(id)) {
                btn.classList.add('selected');
            }
        });
    }
    
    // Update selected cards panel
    function updateSelectedDisplay() {
        const panel = document.getElementById('selectedPanel');
        const badges = document.getElementById('selectedBadges');
        const totalCost = document.getElementById('totalCost');
        const confirmBtn = document.getElementById('confirmBtn');
        const clearBtn = document.getElementById('clearBtn');
        const selectedCount = document.getElementById('selectedCount');
        
        if (selectedCards.length > 0) {
            panel.style.display = 'block';
            clearBtn.style.display = 'block';
            selectedCount.textContent = `${selectedCards.length}/${MAX_CARDS}`;
            
            // Create badges
            badges.innerHTML = '';
            selectedCards.forEach(id => {
                const badge = document.createElement('span');
                badge.className = 'card-badge';
                badge.innerHTML = `#${id} <button class="remove-card" onclick="removeCard(${id})">✕</button>`;
                badges.appendChild(badge);
            });
            
            // Update total cost
            const cost = selectedCards.length * PRICE_PER_CARD;
            totalCost.textContent = `Total: ${cost.toFixed(2)} ETB`;
            
            // Enable confirm button if within balance
            if (cost <= balance) {
                confirmBtn.disabled = false;
                confirmBtn.textContent = `✔ Confirm (${cost.toFixed(2)} ETB)`;
            } else {
                confirmBtn.disabled = true;
                confirmBtn.textContent = `Insufficient (${cost.toFixed(2)} ETB)`;
            }
        } else {
            panel.style.display = 'none';
            clearBtn.style.display = 'none';
            confirmBtn.disabled = true;
            confirmBtn.textContent = '✔ Confirm (0 ETB)';
        }
    }
    
    // Remove specific card
    window.removeCard = function(cardId) {
        const index = selectedCards.indexOf(cardId);
        if (index > -1) {
            selectedCards.splice(index, 1);
            updateSelectedDisplay();
            updateGridHighlight();
        }
    };
    
    // Clear all selections
    window.clearSelection = function() {
        selectedCards = [];
        updateSelectedDisplay();
        updateGridHighlight();
    };
    
    // Confirm selection
    window.confirmSelection = function() {
        if (selectedCards.length === 0) return;
        
        const cost = selectedCards.length * PRICE_PER_CARD;
        if (cost > balance) {
            showMessage('Insufficient balance', 'error');
            return;
        }
        
        // Deduct balance
        balance -= cost;
        document.getElementById('wallet').textContent = `${balance.toFixed(2)} ETB`;
        
        // Add to active and stake
        const activeEl = document.getElementById('active');
        const stakeEl = document.getElementById('stake');
        activeEl.textContent = parseInt(activeEl.textContent) + 1;
        stakeEl.textContent = `${(parseFloat(stakeEl.textContent) + cost).toFixed(2)} ETB`;
        
        // Mark selected cards as taken
        selectedCards.forEach(id => takenCards.add(id));
        
        // Update ready count
        const readyEl = document.getElementById('ready');
        readyEl.textContent = parseInt(readyEl.textContent) + 1;
        
        // Update prize pool (30 ETB + new cards)
        const prizeEl = document.getElementById('prize');
        const currentPrize = parseFloat(prizeEl.textContent);
        prizeEl.textContent = `${(currentPrize + cost).toFixed(2)} ETB`;
        
        // Show success message
        showMessage(`Selected ${selectedCards.length} cards for ${cost.toFixed(2)} ETB`, 'success');
        
        // Clear selection
        selectedCards = [];
        updateSelectedDisplay();
        updateGridHighlight();
    };
    
    // Show message
    function showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.className = `message ${type} show`;
        setTimeout(() => {
            msg.classList.remove('show');
        }, 3000);
    }
    
    // Initialize on load
    window.onload = function() {
        initCardGrid();
    };
</script>
</body>
</html>
