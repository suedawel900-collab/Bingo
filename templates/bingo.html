<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplayer Bingo</title>

<style>
body{
    font-family:Arial;
    background:linear-gradient(135deg,#667eea,#764ba2);
    margin:0;
    padding:10px;
}
.container{
    max-width:650px;
    margin:auto;
    background:white;
    border-radius:15px;
    padding:15px;
}

/* AUTO SWITCH */
.switch{
  position:relative;
  display:inline-block;
  width:50px;
  height:26px;
}
.switch input{opacity:0;width:0;height:0;}
.slider{
  position:absolute;
  cursor:pointer;
  top:0;left:0;right:0;bottom:0;
  background:#ccc;
  transition:.3s;
  border-radius:26px;
}
.slider:before{
  position:absolute;
  content:"";
  height:20px;width:20px;
  left:3px;bottom:3px;
  background:white;
  transition:.3s;
  border-radius:50%;
}
input:checked + .slider{background:#4CAF50;}
input:checked + .slider:before{transform:translateX(24px);}

/* GRID */
.card-grid{
    display:grid;
    grid-template-columns:repeat(10,1fr);
    gap:3px;
    max-height:200px;
    overflow:auto;
}
.card-btn{
    background:#667eea;
    color:white;
    border:none;
    padding:5px;
    font-size:10px;
    border-radius:4px;
}
.card-btn.selected{background:#4CAF50;}
.card-btn.taken{background:#dc3545;opacity:0.6;}

/* SELECTED LIST */
.selected-list div{
    display:flex;
    justify-content:space-between;
    background:#f2f2f2;
    padding:6px;
    margin-bottom:5px;
    border-radius:6px;
}

/* BINGO CARD */
.bingo-card{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
}
.cell{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
    border-radius:6px;
}
.cell.marked{
    background:#4CAF50;
    color:white;
}

.player-list{
    font-size:12px;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="container">

<h2>🎯 Multiplayer Bingo</h2>

<div id="status">Connecting...</div>

<div id="selection">
<h3>Select Cards</h3>
<div id="card-grid" class="card-grid"></div>

<h4>Your Cards</h4>
<div id="selected-list" class="selected-list"></div>

<button onclick="finalizeSelection()">Confirm</button>
</div>

<div id="game" style="display:none;">

<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
<span>🤖 Auto Mode</span>
<label class="switch">
<input type="checkbox" id="auto-checkbox" onchange="toggleAutoMode()">
<span class="slider"></span>
</label>
</div>

<h3 id="last-number">Waiting...</h3>

<div id="card-display" class="bingo-card"></div>

<button onclick="claimBingo()">🎯 BINGO</button>

<div class="player-list">
<h4>Players</h4>
<div id="players"></div>
</div>

</div>

</div>

<script>
const userId = parseInt("{{ user_id }}");
const gameId = parseInt("{{ game_id }}");

let ws;
let selectedCards=[];
let myCards={};
let marked={};
let called=[];
let takenCards=new Set();
let autoMode=false;
let gameStarted=false;

/* CONNECT WS */
function connect(){
    const protocol = location.protocol==="https:"?"wss:":"ws:";
    ws=new WebSocket(`${protocol}//${location.host}/ws/${gameId}/${userId}`);

    ws.onopen=()=>{ document.getElementById("status").innerText="Connected"; };

    ws.onmessage=(msg)=>{
        const data=JSON.parse(msg.data);

        if(data.type==="connected"){
            takenCards=new Set(data.taken_cards||[]);
            updateGrid();
        }

        if(data.type==="card_taken"){
            takenCards=new Set(data.taken_cards||[]);
            updateGrid();
        }

        if(data.type==="your_card"){
            myCards[data.card_id]=data.card;
            marked[data.card_id]=[];
            renderCard(data.card_id);
        }

        if(data.type==="number_called"){
            called=data.called;
            document.getElementById("last-number").innerText="🎲 "+data.number;

            if(autoMode){
                autoMark(data.number);
            }
        }

        if(data.type==="players_update"){
            updatePlayers(data.players);
        }

        if(data.type==="game_started"){
            gameStarted=true;
        }

        if(data.type==="game_reset"){
            resetRound();
        }

        if(data.type==="game_won"){
            alert("Winner: "+data.winner.name);
        }
    };
}
connect();

/* LOAD 1000 CARDS */
function loadCards(){
    const grid=document.getElementById("card-grid");
    for(let i=1;i<=1000;i++){
        const btn=document.createElement("button");
        btn.className="card-btn";
        btn.textContent=i;
        btn.onclick=()=>toggleCard(i);
        grid.appendChild(btn);
    }
}
loadCards();

function toggleCard(id){
    if(takenCards.has(id) && !selectedCards.includes(id)){
        alert("Card taken");
        return;
    }

    const index=selectedCards.indexOf(id);
    if(index>=0) selectedCards.splice(index,1);
    else selectedCards.push(id);

    updateGrid();
    updateList();
}

function updateGrid(){
    document.querySelectorAll(".card-btn").forEach(btn=>{
        const id=parseInt(btn.textContent);
        btn.classList.remove("selected","taken");
        if(selectedCards.includes(id)) btn.classList.add("selected");
        if(takenCards.has(id) && !selectedCards.includes(id)) btn.classList.add("taken");
    });
}

function updateList(){
    const list=document.getElementById("selected-list");
    list.innerHTML="";
    selectedCards.forEach(id=>{
        const div=document.createElement("div");
        div.innerHTML=`🎫 Card #${id} <button onclick="removeCard(${id})">❌</button>`;
        list.appendChild(div);
    });
}

function removeCard(id){
    selectedCards=selectedCards.filter(x=>x!==id);
    updateGrid();
    updateList();
}

function finalizeSelection(){
    if(selectedCards.length===0) return;

    ws.send(JSON.stringify({
        type:"select_cards",
        card_ids:selectedCards
    }));

    ws.send(JSON.stringify({type:"finalize"}));

    document.getElementById("selection").style.display="none";
    document.getElementById("game").style.display="block";
}

function renderCard(cardId){
    const card=myCards[cardId];
    const div=document.getElementById("card-display");
    div.innerHTML="";

    for(let col=0;col<5;col++){
        for(let row=0;row<5;row++){
            const num=card[col][row];
            const cell=document.createElement("div");
            cell.className="cell";
            cell.textContent=num;

            if(num==="FREE"){
                cell.classList.add("marked");
            }

            cell.onclick=()=>markNumber(cardId,num,cell);
            div.appendChild(cell);
        }
    }
}

function markNumber(cardId,num,cell){
    if(!gameStarted) return;
    if(num==="FREE") return;
    if(!called.includes(num)) return alert("Not called");

    if(!marked[cardId].includes(num)){
        ws.send(JSON.stringify({
            type:"mark_number",
            card_id:cardId,
            number:num
        }));
        marked[cardId].push(num);
        cell.classList.add("marked");
    }
}

function autoMark(number){
    Object.keys(myCards).forEach(cardId=>{
        const card=myCards[cardId];

        for(let col=0;col<5;col++){
            for(let row=0;row<5;row++){
                if(card[col][row]===number){
                    ws.send(JSON.stringify({
                        type:"mark_number",
                        card_id:parseInt(cardId),
                        number:number
                    }));
                }
            }
        }
    });
}

function toggleAutoMode(){
    autoMode=document.getElementById("auto-checkbox").checked;
}

function claimBingo(){
    ws.send(JSON.stringify({type:"claim_bingo"}));
}

function updatePlayers(players){
    const div=document.getElementById("players");
    div.innerHTML="";
    players.forEach(p=>{
        div.innerHTML+=`👤 ${p.name} (${p.card_count})<br>`;
    });
}

function resetRound(){
    selectedCards=[];
    myCards={};
    marked={};
    called=[];
    gameStarted=false;
    document.getElementById("selection").style.display="block";
    document.getElementById("game").style.display="none";
}
</script>

</body>
</html>
