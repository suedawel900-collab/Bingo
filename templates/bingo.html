<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo · 1000 cards · Auto/Manual daub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body {
            background: linear-gradient(145deg, #0b2a3e 0%, #1a2340 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            max-width: 640px;
            width: 100%;
            background: #f4f7fc;
            border-radius: 40px;
            box-shadow: 0 25px 50px -8px #00000080;
            overflow: hidden;
            border: 1px solid #ffffff40;
        }
        .header {
            background: linear-gradient(135deg, #264e7b, #5f2b6e);
            color: white;
            padding: 18px 16px;
            text-align: center;
        }
        .header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; }
        .status {
            display: inline-block;
            padding: 6px 24px;
            border-radius: 60px;
            font-weight: 600;
            margin-top: 10px;
            background: #f5b342;
            color: #1e1e1e;
        }
        .status.waiting { background: #f39c12; }
        .status.admin { background: #f1c40f; box-shadow: 0 0 0 3px gold; }
        .status.playing { background: #2e7d32; color: white; }
        .status.winner { background: #9b4d96; color: white; animation: softGlow 1s infinite; }
        @keyframes softGlow { 50% { filter: brightness(1.2); } }

        .wallet-bar {
            background: #0f212e;
            color: white;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #2f4a62;
        }
        .wallet-item { text-align: center; }
        .wallet-label { font-size: 0.7rem; opacity: 0.7; }
        .wallet-value { font-weight: 700; font-size: 1.2rem; }
        .green { color: #4ade80; }
        .blue { color: #7abef7; }
        .orange { color: #fbbf24; }

        .info-bar-top {
            background: #1c3f5a;
            color: white;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
        }
        .prize-value { color: #ffe484; font-size: 1.5rem; font-weight: 800; }

        .players-ready-bar {
            background: #1b4b6c;
            color: white;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }
        .timer-container {
            background: #002642;
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 2.8rem;
            font-family: monospace;
            display: none;
        }

        /* selection area */
        .selection, .game-screen { padding: 18px 16px; background: #f0f4fa; }
        .selection h2 { font-size: 1.5rem; margin-bottom: 6px; color: #0b2b40; }

        .selected-cards-panel {
            background: #fff3db;
            border-radius: 30px;
            padding: 14px;
            max-height: 130px;
            overflow-y: auto;
            margin-bottom: 16px;
            border: 1px solid #f1c40f;
        }
        .selected-badges { display: flex; flex-wrap: wrap; gap: 6px; }
        .card-badge {
            background: #f39c12;
            color: #1e1e1e;
            padding: 4px 8px 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .remove-card {
            background: #00000030;
            border: none;
            color: white;
            border-radius: 50%;
            width: 20px; height: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .card-grid-container {
            max-height: 220px;
            overflow-y: auto;
            background: white;
            border-radius: 30px;
            padding: 14px;
            border: 2px solid #aac2d9;
            margin-bottom: 18px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(10,1fr);
            gap: 5px;
        }
        .card-btn {
            aspect-ratio: 1/1;
            background: #3a5f8b;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
        }
        .card-btn.taken { background: #7f8c8d; opacity: 0.5; cursor: not-allowed; }
        .card-btn.selected { background: #2e7d32; box-shadow: 0 0 0 3px gold; transform: scale(1.03); }

        .action-buttons { display: flex; gap: 12px; }
        .action-btn { flex: 1; padding: 14px; border-radius: 60px; font-weight: 700; border: none; cursor: pointer; }
        .confirm-btn { background: #2e7d32; color: white; }
        .clear-btn { background: #c0392b; color: white; }

        /* game screen specifics */
        .auto-toggle {
            background: #1f4a6e;
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
            font-weight: 600;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 56px; height: 28px;
        }
        .switch input { opacity:0; width:0; height:0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top:0; left:0; right:0; bottom:0;
            background-color: #b0c4de;
            border-radius: 34px;
            transition: 0.2s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 24px; width: 24px; left: 2px; bottom: 2px;
            background-color: white;
            border-radius: 50%;
            transition: 0.2s;
        }
        input:checked + .slider { background-color: #4caf50; }
        input:checked + .slider:before { transform: translateX(28px); }

        .bingo-card {
            display: grid;
            grid-template-columns: repeat(5,1fr);
            gap: 6px;
            background: #1f3b58;
            padding: 14px;
            border-radius: 28px;
        }
        .card-cell {
            aspect-ratio: 1/1;
            background: #eef3fc;
            border: 2px solid white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: #102331;
        }
        .card-cell.marked { background: #2e7d32; color: white; border-color: #a5d6a5; }
        .card-cell.free { background: #f9d857; border-color: gold; }

        .called-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .called-badge { background: #2e7d32; color: white; padding: 4px 12px; border-radius: 30px; }

        .bingo-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(145deg, #e66465, #f09b4a);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 2rem;
            font-weight: 800;
            margin: 16px 0;
        }
        .bingo-btn:disabled { opacity: 0.4; }

        .start-btn {
            width:100%;
            padding: 18px;
            background: #f5b342;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            animation: pulse 1.5s infinite;
        }
        .winner-announcement {
            background: #ffde7a;
            color: #1e1e1e;
            padding: 24px;
            border-radius: 50px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 15px;
        }
        .message {
            padding: 12px;
            margin: 10px 16px 20px;
            border-radius: 60px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
        .message.success { background: #b9f6ca; color: #1b5e20; display: block; }
        .message.error { background: #ffcdd2; color: #b71c1c; display: block; }
        .message.info { background: #b3e5fc; color: #01579b; display: block; }
        .back-btn { display: block; text-align: center; color: #6b8cae; margin-top: 12px; }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <h1>🎯 BINGO · 1000</h1>
        <p>Game <span id="game-id">0</span> | Player <span id="player-id">0</span></p>
        <div id="status" class="status waiting">⏳ WAITING</div>
    </div>

    <!-- wallet etc -->
    <div class="wallet-bar">
        <div class="wallet-item"><span class="wallet-label">WALLET</span><div class="wallet-value green" id="wallet-balance">0.00 ETB</div></div>
        <div class="wallet-item"><span class="wallet-label">ACTIVE</span><div class="wallet-value blue" id="active-games">0</div></div>
        <div class="wallet-item"><span class="wallet-label">STAKE</span><div class="wallet-value orange" id="total-stake">0.00 ETB</div></div>
    </div>

    <div class="info-bar-top">
        <div><span>🎮 ROUND</span> <strong id="active-round">1</strong></div>
        <div><span>💰 PRIZE</span> <span class="prize-value" id="prize-pool">0 ETB</span></div>
    </div>
    <div class="players-ready-bar">
        <span>👥 READY</span> <span id="ready-count">0/<span id="total-players">0</span></span>
    </div>
    <div class="timer-container" id="timer-container"><div id="timer">2:00</div><div id="numbers-left">75 left</div></div>

    <!-- SELECTION SCREEN -->
    <div id="selection" class="selection">
        <h2>📌 Pick cards (max <span id="max-cards-display">10</span>)</h2>
        <p><span id="price-display">2</span> ETB each · one round only</p>
        <div id="selected-panel" class="selected-cards-panel" style="display:none">
            <div class="selected-header">Your cards</div>
            <div id="selected-badges" class="selected-badges"></div>
            <div id="total-cost" class="total-cost" style="font-weight:700;margin-top:6px;">Total: 0 ETB</div>
        </div>
        <div class="card-grid-container">
            <div id="card-grid" class="card-grid"></div>
        </div>
        <div class="action-buttons">
            <button class="action-btn clear-btn" id="clear-btn" onclick="clearSelection()" style="display:none">🗑 Clear</button>
            <button class="action-btn confirm-btn" id="confirm-btn" onclick="finalizeSelection()" disabled>✅ Confirm (0 ETB)</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game" class="game-screen" style="display:none">
        <div id="winner-announcement" class="winner-announcement" style="display:none"></div>
        <div class="game-prize-bar" style="background:#f0c45a;padding:12px 18px;border-radius:40px;margin-bottom:15px;display:flex;justify-content:space-between;font-weight:800">
            <span>🏆 ROUND PRIZE</span> <span id="game-prize">0 ETB</span>
        </div>

        <!-- AUTO/MANUAL TOGGLE (only visible during game) -->
        <div class="auto-toggle">
            <span>🤖 Auto‑daub numbers</span>
            <label class="switch">
                <input type="checkbox" id="autoDaubToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="last-number" id="last-number" style="background:#1e3f5a;color:white;padding:20px;border-radius:40px;font-size:2.4rem;text-align:center;margin:10px 0">🎲 ...</div>

        <div class="called-numbers-container" style="background:#d9e6f2;padding:12px;border-radius:30px;max-height:100px;overflow-y:auto;margin-bottom:10px">
            <div style="font-weight:600;">📋 Called</div>
            <div id="called-numbers-list" class="called-grid"></div>
        </div>

        <div id="card-tabs" class="card-tabs" style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0"></div>

        <div id="current-card-area">
            <div id="current-card-title" style="font-weight:600;">Card #—</div>
            <div id="card-display" class="bingo-card"></div>
        </div>

        <button class="bingo-btn" id="bingo-btn" onclick="checkBingo()" disabled>🎯 BINGO!</button>

        <div id="admin-controls" class="admin-controls" style="display:none">
            <button class="start-btn" onclick="startGame()">🚀 START GAME</button>
        </div>

        <div class="players-list" style="background:#dee7f0;border-radius:30px;padding:14px;max-height:120px;overflow-y:auto">
            <div>Players:</div><div id="players-list"></div>
        </div>
        <a href="https://t.me/Treeeeestbot" class="back-btn">◀️ back</a>
    </div>

    <div id="message" class="message"></div>
</div>

<script>
    (function() {
        // ------ CONFIG (backend placeholders) ------
        const USER_ID = parseInt('{{ user_id }}') || 1001;
        const GAME_ID = parseInt('{{ game_id }}') || 55;
        const ADMIN_ID = '{{ admin_id }}' || '999';
        const PRICE_PER_CARD = parseFloat('{{ price_per_card }}') || 2.0;
        const MAX_CARDS = parseInt('{{ max_cards }}') || 10;
        const INIT_BALANCE = parseFloat('{{ initial_balance }}') || 150;
        const INIT_ACTIVE = parseInt('{{ initial_active_games }}') || 0;
        const INIT_STAKE = parseFloat('{{ initial_stake }}') || 0;

        // ------ GLOBAL STATE ------
        const isAdmin = (USER_ID == ADMIN_ID);
        const TOTAL_NUMBERS = 75;
        let ws = null;
        let selectedCards = [];                 // currently selected card ids (during selection)
        let myCards = {};                        // cardId -> 5x5 matrix
        let marked = {};                          // cardId -> array of marked numbers
        let called = [];
        let players = [];
        let takenCards = new Set();
        let gameStarted = false;
        let currentRound = 1;
        let currentWinner = null;
        let currentCardIndex = 0;
        let balance = INIT_BALANCE;
        let activeGames = INIT_ACTIVE;
        let totalStake = INIT_STAKE;
        let prizePool = 0;
        let autoDaub = true;                      // default AUTO on

        // DOM elements
        const statusDiv = document.getElementById('status');
        const selectionDiv = document.getElementById('selection');
        const gameDiv = document.getElementById('game');
        const timerContainer = document.getElementById('timer-container');
        const confirmBtn = document.getElementById('confirm-btn');
        const clearBtn = document.getElementById('clear-btn');
        const selectedPanel = document.getElementById('selected-panel');
        const selectedBadges = document.getElementById('selected-badges');
        const totalCostSpan = document.getElementById('total-cost');
        const prizePoolSpan = document.getElementById('prize-pool');
        const gamePrizeSpan = document.getElementById('game-prize');
        const readyCountSpan = document.getElementById('ready-count');
        const totalPlayersSpan = document.getElementById('total-players');
        const gamePlayersSpan = document.getElementById('game-players');
        const playersListDiv = document.getElementById('players-list');
        const lastNumberDiv = document.getElementById('last-number');
        const calledListDiv = document.getElementById('called-numbers-list');
        const numbersLeftSpan = document.getElementById('numbers-left');
        const walletBalance = document.getElementById('wallet-balance');
        const activeGamesSpan = document.getElementById('active-games');
        const totalStakeSpan = document.getElementById('total-stake');
        const activeRoundSpan = document.getElementById('active-round');
        const bingoBtn = document.getElementById('bingo-btn');
        const winnerAnnounce = document.getElementById('winner-announcement');
        const autoToggle = document.getElementById('autoDaubToggle');

        // initial UI
        document.getElementById('game-id').innerText = GAME_ID;
        document.getElementById('player-id').innerText = USER_ID;
        document.getElementById('price-display').innerText = PRICE_PER_CARD;
        document.getElementById('max-cards-display').innerText = MAX_CARDS;
        if (isAdmin) {
            document.getElementById('admin-controls').style.display = 'block';
            statusDiv.className = 'status admin';
            statusDiv.innerText = '👑 ADMIN';
        }

        // wallet update
        function updateWallet() {
            walletBalance.innerText = balance.toFixed(2) + ' ETB';
            activeGamesSpan.innerText = activeGames;
            totalStakeSpan.innerText = totalStake.toFixed(2) + ' ETB';
        }
        updateWallet();

        // prize calculator
        function calcPrizePool() {
            let ready = players.filter(p => p.card_count > 0);
            let totalCards = ready.reduce((acc, p) => acc + p.card_count, 0);
            prizePool = totalCards * PRICE_PER_CARD;
            prizePoolSpan.innerText = prizePool.toFixed(2) + ' ETB';
            gamePrizeSpan.innerText = prizePool.toFixed(2) + ' ETB';
            return prizePool;
        }

        // reset for new round (cards expire) -> show selection
        function resetForNewRound() {
            selectedCards = [];
            myCards = {};
            marked = {};
            called = [];
            gameStarted = false;
            currentWinner = null;
            selectionDiv.style.display = 'block';
            gameDiv.style.display = 'none';
            timerContainer.style.display = 'none';
            statusDiv.className = 'status waiting';
            statusDiv.innerText = '⏳ WAITING FOR ADMIN';
            lastNumberDiv.innerText = '🎲 waiting ...';
            updateSelectedDisplay();
            bingoBtn.disabled = true;
            if (autoToggle) autoToggle.checked = true; // reset to auto
            autoDaub = true;
            showMessage('🔄 Round ended — select new cards', 'info');
        }

        // ----- CARD SELECTION UI -----
        function loadCards() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 1000; i++) {
                const btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.textContent = i;
                btn.onclick = () => toggleCardSelection(i);
                grid.appendChild(btn);
            }
            updateCardGrid();
        }

        function toggleCardSelection(cardId) {
            if (takenCards.has(cardId) && !selectedCards.includes(cardId)) {
                showMessage(`❌ Card #${cardId} taken`, 'error');
                return;
            }
            const idx = selectedCards.indexOf(cardId);
            if (idx >= 0) selectedCards.splice(idx,1);
            else {
                if (selectedCards.length >= MAX_CARDS) {
                    showMessage(`Max ${MAX_CARDS} cards`, 'error');
                    return;
                }
                selectedCards.push(cardId);
            }
            selectedCards.sort((a,b)=>a-b);
            updateSelectedDisplay();
            updateCardGrid();
        }

        function updateSelectedDisplay() {
            if (selectedCards.length) {
                selectedPanel.style.display = 'block';
                clearBtn.style.display = 'block';
                let html = '';
                selectedCards.forEach(id => {
                    html += `<span class="card-badge">#${id} <button class="remove-card" onclick="removeCard(${id})">✕</button></span>`;
                });
                selectedBadges.innerHTML = html;
                let cost = selectedCards.length * PRICE_PER_CARD;
                totalCostSpan.innerText = `Total: ${cost.toFixed(2)} ETB`;
                if (cost <= balance) {
                    confirmBtn.disabled = false;
                    confirmBtn.innerText = `✅ Confirm (${cost.toFixed(2)} ETB)`;
                } else {
                    confirmBtn.disabled = true;
                    confirmBtn.innerText = `❌ Insufficient (${cost.toFixed(2)} ETB)`;
                }
            } else {
                selectedPanel.style.display = 'none';
                clearBtn.style.display = 'none';
                confirmBtn.disabled = true;
                confirmBtn.innerText = 'Confirm (0 ETB)';
            }
        }

        window.removeCard = function(cardId) {
            const idx = selectedCards.indexOf(cardId);
            if (idx>=0) selectedCards.splice(idx,1);
            updateSelectedDisplay();
            updateCardGrid();
        };
        window.clearSelection = function() { selectedCards = []; updateSelectedDisplay(); updateCardGrid(); };

        function updateCardGrid() {
            document.querySelectorAll('.card-btn').forEach(btn => {
                let id = parseInt(btn.textContent);
                btn.classList.remove('taken','selected');
                if (takenCards.has(id) && !selectedCards.includes(id)) btn.classList.add('taken');
                if (selectedCards.includes(id)) btn.classList.add('selected');
            });
        }

        // finalize: send selection to server (mock)
        function finalizeSelection() {
            if (!selectedCards.length) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showMessage('⚠️ Using demo mode (simulated)', 'info');
                // demo: mark taken and create myCards
                let cost = selectedCards.length * PRICE_PER_CARD;
                if (cost > balance) { showMessage('insufficient', 'error'); return; }
                balance -= cost;
                totalStake += cost;
                activeGames++;
                selectedCards.forEach(id => takenCards.add(id));
                // generate dummy card 5x5
                selectedCards.forEach(id => {
                    let card = Array(5).fill().map(()=>Array(5).fill().map(()=>Math.floor(Math.random()*75)+1));
                    card[2][2] = 'FREE'; // free space
                    myCards[id] = card;
                    marked[id] = [];
                });
                players.push({id:USER_ID, name:'Player'+USER_ID, card_count:selectedCards.length});
                updateWallet();
                updateCardGrid();
                showGameScreen();
                showMessage('Cards confirmed (demo)', 'success');
                return;
            }
            // real send
            ws.send(JSON.stringify({type:'select_cards', card_ids:selectedCards}));
            setTimeout(()=> ws.send(JSON.stringify({type:'finalize'})), 300);
        }

        // show game screen (after selection)
        function showGameScreen() {
            selectionDiv.style.display = 'none';
            gameDiv.style.display = 'block';
            // build tabs
            const tabsDiv = document.getElementById('card-tabs');
            tabsDiv.innerHTML = '';
            let ids = Object.keys(myCards).sort((a,b)=>+a - +b);
            ids.forEach((id, idx) => {
                let tab = document.createElement('span');
                tab.className = 'card-tab';
                tab.style.background='white'; tab.style.padding='5px 14px'; tab.style.borderRadius='40px'; tab.style.cursor='pointer';
                tab.innerText = '#'+id;
                tab.onclick = () => switchCard(idx);
                if (idx===0) tab.style.background='#4361ee'; tab.style.color= idx===0?'white':'black';
                tabsDiv.appendChild(tab);
            });
            if (ids.length) switchCard(0);
            gamePlayersSpan.innerText = players.filter(p=>p.card_count>0).length;
            updateCalledList();
        }

        function switchCard(index) {
            currentCardIndex = index;
            let tabs = document.querySelectorAll('.card-tab');
            tabs.forEach((t,i)=> {
                if(i===index) { t.style.background='#4361ee'; t.style.color='white'; }
                else { t.style.background='white'; t.style.color='black'; }
            });
            renderCurrentCard();
        }

        function renderCurrentCard() {
            let ids = Object.keys(myCards).sort((a,b)=>+a-+b);
            if (!ids.length) return;
            let cardId = ids[currentCardIndex];
            let matrix = myCards[cardId];
            let markedArr = marked[cardId] || [];
            document.getElementById('current-card-title').innerText = `Card #${cardId}`;
            let div = document.getElementById('card-display');
            div.innerHTML = '';
            for (let r=0; r<5; r++) {
                for (let c=0; c<5; c++) {
                    let cell = document.createElement('div');
                    cell.className = 'card-cell';
                    let val = matrix[c][r];  // column, row (any)
                    if (val === 'FREE') { cell.classList.add('free','marked'); cell.innerText = '⭐'; }
                    else {
                        cell.innerText = val;
                        if (markedArr.includes(val)) cell.classList.add('marked');
                    }
                    // manual marking only if auto is OFF and game started
                    cell.onclick = () => {
                        if (!gameStarted) return;
                        if (autoDaub) { showMessage('Auto-daub is ON, toggle off to mark manually','info'); return; }
                        if (val === 'FREE') return;
                        if (!called.includes(val)) { showMessage('❌ Not called yet','error'); return; }
                        if (markedArr.includes(val)) return;
                        // send mark
                        if (ws && ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type:'mark_number', card_id:+cardId, number:val}));
                        else {
                            // demo mark
                            marked[cardId].push(val);
                            renderCurrentCard();
                        }
                    };
                    div.appendChild(cell);
                }
            }
        }

        // auto-daub: when number called, if auto on, mark all matching on all player cards
        function autoMarkAllCalled(number) {
            if (!autoDaub) return;
            Object.keys(myCards).forEach(cid => {
                let matrix = myCards[cid];
                let flat = matrix.flat();
                if (flat.includes(number) && !marked[cid].includes(number)) {
                    marked[cid].push(number);
                }
            });
            renderCurrentCard();
        }

        function updateCalledList() {
            calledListDiv.innerHTML = called.map(n => `<span class="called-badge">${n}</span>`).join('');
            numbersLeftSpan.innerText = (TOTAL_NUMBERS - called.length) + ' left';
        }

        // ---- demo websocket fallback + event handlers (simulate game) ----
        function connectWebSocket() {
            // use mock if fails
            mockConnection();
        }

        function mockConnection() {
            console.log('🧪 Using demo mode (no server)');
            // initial taken cards (some random)
            for (let i=0;i<20;i++) takenCards.add(Math.floor(Math.random()*1000)+1);
            players = [{id:1,name:'Alice',card_count:2},{id:2,name:'Bob',card_count:1}];
            if (!players.find(p=>p.id===USER_ID)) players.push({id:USER_ID, name:'You', card_count:0});
            calcPrizePool();
            updatePlayersList();
            loadCards();
        }

        function updatePlayersList() {
            let html = players.map(p => `<span class="player-badge">${p.name} (${p.card_count})${p.id===USER_ID?'👈':''}</span>`).join(' ');
            playersListDiv.innerHTML = html;
            let ready = players.filter(p=>p.card_count>0).length;
            readyCountSpan.innerText = ready;
            totalPlayersSpan.innerText = players.length;
            gamePlayersSpan.innerText = ready;
        }

        // admin start game
        window.startGame = function() {
            if (!isAdmin) return;
            gameStarted = true;
            statusDiv.className = 'status playing';
            statusDiv.innerText = '🎮 PLAYING';
            timerContainer.style.display = 'block';
            bingoBtn.disabled = false;
            showMessage('🚀 Game started!', 'success');
            // simulate first number after 3 sec
            setTimeout(()=> callRandomNumber(), 2000);
        };

        function callRandomNumber() {
            if (!gameStarted) return;
            let newNum = Math.floor(Math.random()*75)+1;
            while (called.includes(newNum)) newNum = Math.floor(Math.random()*75)+1;
            called.push(newNum);
            lastNumberDiv.innerText = `🎲 ${newNum}`;
            updateCalledList();

            // AUTO-DAUB: if auto enabled, mark for all my cards
            if (autoDaub) {
                Object.keys(myCards).forEach(cid => {
                    let flat = myCards[cid].flat();
                    if (flat.includes(newNum) && !marked[cid].includes(newNum)) {
                        marked[cid].push(newNum);
                    }
                });
                renderCurrentCard();
            }

            // simulate next numbers every 5 sec
            if (called.length < 75 && gameStarted) setTimeout(()=> callRandomNumber(), 5000);
        }

        window.checkBingo = function() {
            if (!gameStarted) return;
            // check any card has all numbers marked? not full validation, just demo
            showMessage('🎯 Bingo claimed! (demo)', 'success');
            // mock win
            gameStarted = false;
            currentWinner = { id:USER_ID, name:'You', card_id: Object.keys(myCards)[0] };
            statusDiv.className = 'status winner';
            statusDiv.innerText = '🏆 WINNER';
            winnerAnnounce.style.display = 'block';
            winnerAnnounce.innerText = `🏆 YOU WIN with card #${currentWinner.card_id} 🏆`;
            bingoBtn.disabled = true;
            timerContainer.style.display = 'none';
            // after 6 seconds, reset for new round (cards expire)
            setTimeout(() => {
                // reset everything: cards are invalid, must buy again
                resetForNewRound();
                // but keep players
                players.forEach(p => { if(p.id===USER_ID) p.card_count=0; });
                myCards = {};
                marked = {};
                winnerAnnounce.style.display = 'none';
                updatePlayersList();
                loadCards();
            }, 6000);
        };

        // toggle auto
        if (autoToggle) {
            autoToggle.addEventListener('change', function(e) {
                autoDaub = e.target.checked;
                showMessage(autoDaub ? '🤖 Auto-daub ON' : '✋ Manual mode ON', 'info');
            });
        }

        // helper
        function showMessage(txt, type) {
            let msg = document.getElementById('message');
            msg.innerText = txt;
            msg.className = `message ${type}`;
            setTimeout(() => msg.style.display = 'none', 2800);
        }

        // start
        window.onload = function() {
            connectWebSocket();
            // extra mock: after 10 sec, if not started and admin, show start option
        };
    })();
</script>
</body>
</html>
