<!DOCTYPE html>
<html>
<body>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        const gameId = urlParams.get('game_id') || 1;
        const adminId = 8741250511;  // your admin ID

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/${gameId}/${userId}`;
        const ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            console.log('✅ WebSocket open');
            document.body.innerHTML += '<p>WebSocket connected</p>';
            // Send start_game after 1 second
            setTimeout(() => {
                ws.send(JSON.stringify({type: 'start_game'}));
                console.log('📤 Sent start_game');
                document.body.innerHTML += '<p>Sent start_game</p>';
            }, 1000);
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log('📩 Received:', data);
            document.body.innerHTML += `<p>Received: ${JSON.stringify(data)}</p>`;
        };

        ws.onerror = (err) => {
            console.error('❌ WebSocket error', err);
            document.body.innerHTML += '<p>WebSocket error</p>';
        };
    </script>
</body>
</html>
