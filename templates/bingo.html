<!DOCTYPE html>
<html>
<head>
    <title>Bingo Game - 1000 Cards</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }
        .header h1 { font-size: 32px; }
        .header p { font-size: 14px; opacity: 0.9; }
        #status { 
            display: inline-block;
            padding: 5px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            margin-top: 5px;
        }
        
        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #2c3e50;
            color: white;
            padding: 10px 15px;
        }
        .status-item { text-align: center; }
        .status-label { font-size: 11px; opacity: 0.7; }
        .status-value { font-weight: bold; font-size: 18px; }
        .status-value.green { color: #4CAF50; }
        .status-value.blue { color: #64b5f6; }
        .status-value.orange { color: #ff9800; }
        
        /* Pattern Bar */
        .pattern-bar {
            background: #ffd700;
            color: #333;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        .pattern-name {
            background: #333;
            color: #ffd700;
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        /* Info Bar */
        .info-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-around;
        }
        .info-item { text-align: center; }
        .info-value { font-size: 22px; font-weight: bold; }
        .prize-value { color: #ffd700; }
        
        /* Main Content - Two Columns */
        .main-content {
            display: flex;
            padding: 15px;
            gap: 15px;
        }
        
        /* LEFT COLUMN - Card Selection */
        .left-column {
            flex: 1;
            max-width: 400px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        /* Selected Cards - HORIZONTAL SCROLL LIST */
        .selected-cards-horizontal {
            background: #fff3e0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #ffb74d;
        }
        .selected-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 12px;
        }
        .selected-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            min-height: 100px;
            scrollbar-width: thin;
            scrollbar-color: #ff9800 #fff3e0;
        }
        .selected-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .selected-scroll::-webkit-scrollbar-track {
            background: #fff3e0;
            border-radius: 10px;
        }
        .selected-scroll::-webkit-scrollbar-thumb {
            background: #ff9800;
            border-radius: 10px;
        }
        .selected-card {
            flex: 0 0 auto;
            width: 100px;
            background: white;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #ff9800;
            position: relative;
        }
        .selected-card-number {
            font-size: 20px;
            font-weight: bold;
            color: #e65100;
            margin-bottom: 5px;
        }
        .selected-card-price {
            font-size: 14px;
            color: #4CAF50;
            font-weight: bold;
        }
        .selected-card-remove {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 24px;
            height: 24px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .total-cost-horizontal {
            text-align: right;
            font-weight: bold;
            color: #e65100;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px solid #ffb74d;
            font-size: 16px;
        }
        
        /* Card Grid - 1000 cards */
        .card-grid-container {
            max-height: 350px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 8px;
            background: #f8f9fa;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 2px;
        }
        .card-btn {
            aspect-ratio: 1;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 9px;
            cursor: pointer;
            font-weight: bold;
        }
        .card-btn.selected {
            background: #4CAF50;
            box-shadow: 0 0 0 2px gold;
        }
        .card-btn.taken {
            background: #dc3545;
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .confirm-btn {
            background: #4CAF50;
            color: white;
        }
        .confirm-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .clear-btn {
            background: #dc3545;
            color: white;
        }
        
        /* RIGHT COLUMN - Game Area */
        .right-column {
            flex: 1;
        }
        
        /* Called Numbers */
        .called-numbers-section {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .called-title {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .called-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 80px;
            overflow-y: auto;
        }
        .called-badge {
            background: #4CAF50;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        
        /* Last Number */
        .last-number {
            background: #4CAF50;
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        /* Current Card - 5x5 Grid */
        .current-card-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 3px solid #667eea;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .card-title span {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            margin-left: 10px;
        }
        
        /* 5x5 Grid */
        .bingo-grid {
            display: grid !important;
            grid-template-columns: repeat(5, 1fr) !important;
            gap: 8px;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }
        
        .bingo-cell {
            aspect-ratio: 1;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .bingo-cell.marked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }
        .bingo-cell.free {
            background: #ffd700;
            border-color: #ffd700;
        }
        
        /* Auto-mark */
        .auto-mark {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        
        /* START GAME BUTTON */
        .start-game-section {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border: 3px solid gold;
        }
        .start-game-btn {
            width: 100%;
            padding: 15px;
            background: white;
            color: #ff9800;
            border: none;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            animation: pulse 1.5s infinite;
        }
        .start-game-btn.ready {
            background: #4CAF50;
            color: white;
            animation: none;
        }
        
        /* BINGO Button */
        .bingo-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .bingo-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Players List */
        .players-list {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            max-height: 80px;
            overflow-y: auto;
        }
        .player-badge {
            display: inline-block;
            padding: 4px 10px;
            background: white;
            border-radius: 20px;
            margin: 3px;
            border: 1px solid #ddd;
        }
        .player-badge.ready {
            background: #4CAF50;
            color: white;
        }
        
        /* Message */
        .message {
            text-align: center;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 BINGO</h1>
            <p>Game #<span id="game-id">1</span> | Player: <span id="player-id">8741250511</span></p>
            <div id="status">👑 ADMIN</div>
        </div>
        
        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-label">WALLET</div>
                <div class="status-value green" id="wallet-balance">10.00 ETB</div>
            </div>
            <div class="status-item">
                <div class="status-label">ACTIVE</div>
                <div class="status-value blue" id="active-games">0</div>
            </div>
            <div class="status-item">
                <div class="status-label">STAKE</div>
                <div class="status-value orange" id="total-stake">0.00 ETB</div>
            </div>
        </div>
        
        <!-- Pattern Bar -->
        <div class="pattern-bar">
            <span>🎯 Current Pattern:</span>
            <span class="pattern-name" id="pattern-name">Full House</span>
        </div>
        
        <!-- Info Bar -->
        <div class="info-bar">
            <div class="info-item">
                <div>Round</div>
                <div class="info-value" id="active-game-display">1</div>
            </div>
            <div class="info-item">
                <div>Prize</div>
                <div class="info-value prize-value" id="prize-pool">10.00 ETB</div>
            </div>
            <div class="info-item">
                <div>Ready</div>
                <div class="info-value" id="ready-count">1</div>
            </div>
        </div>
        
        <!-- Main Content - Two Columns -->
        <div class="main-content">
            <!-- LEFT COLUMN: Card Selection -->
            <div class="left-column">
                <div class="section-title">📋 Choose Cards (10 ETB each)</div>
                
                <!-- Selected Cards - HORIZONTAL SCROLL LIST -->
                <div id="selected-panel" class="selected-cards-horizontal">
                    <div class="selected-header">
                        <span>Your Cards</span>
                        <span id="selected-count">1/20</span>
                    </div>
                    <div id="selected-scroll" class="selected-scroll">
                        <!-- Card #97 -->
                        <div class="selected-card">
                            <div class="selected-card-number">#97</div>
                            <div class="selected-card-price">10 ETB</div>
                            <button class="selected-card-remove" onclick="removeCard(97)">✕</button>
                        </div>
                        <!-- You can add more cards here -->
                    </div>
                    <div id="total-cost" class="total-cost-horizontal">Total: 10.00 ETB</div>
                </div>
                
                <!-- Card Grid - 1000 cards -->
                <div class="card-grid-container">
                    <div class="card-grid" id="card-grid"></div>
                </div>
                
                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="action-btn clear-btn" id="clear-btn" onclick="clearSelection()">Clear</button>
                    <button class="action-btn confirm-btn" id="confirm-btn" disabled>✓ READY</button>
                </div>
            </div>
            
            <!-- RIGHT COLUMN: Game Area -->
            <div class="right-column">
                <!-- Called Numbers -->
                <div class="called-numbers-section">
                    <div class="called-title">📋 CALLED NUMBERS:</div>
                    <div id="called-numbers-list" class="called-list">
                        <span class="called-badge">10</span>
                        <span class="called-badge">20</span>
                        <span class="called-badge">21</span>
                        <span class="called-badge">30</span>
                        <span class="called-badge">19</span>
                        <span class="called-badge">24</span>
                        <span class="called-badge">32</span>
                        <span class="called-badge">33</span>
                    </div>
                </div>
                
                <!-- Last Number Called -->
                <div class="last-number" id="last-number">🎲 33</div>
                
                <!-- Current Card - 5x5 Grid -->
                <div class="current-card-section">
                    <div class="card-title">
                        Your Card: <span id="current-card-id">#97</span>
                    </div>
                    <div id="card-display" class="bingo-grid">
                        <!-- Card will be rendered here -->
                    </div>
                </div>
                
                <!-- Auto-mark Toggle -->
                <div class="auto-mark">
                    <label>
                        <input type="checkbox" id="autoDaub"> 🤖 Auto-mark numbers
                    </label>
                </div>
                
                <!-- START GAME BUTTON -->
                <div class="start-game-section">
                    <button class="start-game-btn" id="start-game-btn" onclick="startGame()">🚀 START GAME</button>
                </div>
                
                <!-- BINGO Button -->
                <button class="bingo-btn" id="bingo-btn" onclick="checkBingo()">🎯 BINGO!</button>
                
                <!-- Players List -->
                <div class="players-list" id="players-list">
                    <span class="player-badge ready">Admin (1)</span>
                </div>
            </div>
        </div>
        
        <!-- Message Area -->
        <div id="message" class="message"></div>
    </div>

    <script>
        // Card #97 data - 5x5 grid
        const card97 = [
            [9, 3, 5, 21, 28],
            [18, 43, 44, 'FREE', 60],
            [53, 57, 73, 67, 68],
            [12, 34, 45, 56, 72],
            [14, 25, 36, 47, 58]
        ];
        
        // Called numbers
        const calledNumbers = [10, 20, 21, 30, 19, 24, 32, 33];
        
        // Selected cards
        let selectedCards = [97];
        
        // Load cards 1-1000
        function loadCards() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= 1000; i++) {
                const btn = document.createElement('button');
                btn.className = 'card-btn';
                if (i === 97) btn.classList.add('selected');
                btn.textContent = i;
                btn.onclick = () => toggleCard(i);
                grid.appendChild(btn);
            }
        }
        
        // Toggle card selection
        function toggleCard(cardId) {
            if (selectedCards.includes(cardId)) {
                selectedCards = selectedCards.filter(id => id !== cardId);
            } else {
                if (selectedCards.length < 20) {
                    selectedCards.push(cardId);
                } else {
                    alert('Maximum 20 cards allowed');
                    return;
                }
            }
            updateSelectedDisplay();
            updateCardGrid();
        }
        
        // Update selected cards display (horizontal)
        function updateSelectedDisplay() {
            const scroll = document.getElementById('selected-scroll');
            const totalCost = document.getElementById('total-cost');
            const selectedCount = document.getElementById('selected-count');
            
            scroll.innerHTML = '';
            
            selectedCards.sort((a, b) => a - b).forEach(id => {
                const card = document.createElement('div');
                card.className = 'selected-card';
                card.innerHTML = `
                    <div class="selected-card-number">#${id}</div>
                    <div class="selected-card-price">10 ETB</div>
                    <button class="selected-card-remove" onclick="removeCard(${id})">✕</button>
                `;
                scroll.appendChild(card);
            });
            
            const cost = selectedCards.length * 10;
            totalCost.textContent = `Total: ${cost.toFixed(2)} ETB`;
            selectedCount.textContent = `${selectedCards.length}/20`;
        }
        
        // Remove card
        function removeCard(cardId) {
            selectedCards = selectedCards.filter(id => id !== cardId);
            updateSelectedDisplay();
            updateCardGrid();
        }
        
        // Clear all cards
        function clearSelection() {
            selectedCards = [];
            updateSelectedDisplay();
            updateCardGrid();
        }
        
        // Update card grid highlighting
        function updateCardGrid() {
            document.querySelectorAll('.card-btn').forEach(btn => {
                const id = parseInt(btn.textContent);
                btn.classList.remove('selected');
                if (selectedCards.includes(id)) {
                    btn.classList.add('selected');
                }
            });
        }
        
        // Render card #97 as 5x5 grid
        function renderCard97() {
            const grid = document.getElementById('card-display');
            grid.innerHTML = '';
            
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'bingo-cell';
                    
                    let num = card97[row][col];
                    cell.textContent = num;
                    
                    if (calledNumbers.includes(num) && num !== 'FREE') {
                        cell.classList.add('marked');
                    }
                    
                    if (num === 'FREE') {
                        cell.classList.add('free', 'marked');
                    }
                    
                    cell.onclick = () => markNumber(num);
                    grid.appendChild(cell);
                }
            }
        }
        
        // Mark number
        function markNumber(num) {
            if (num === 'FREE') return;
            alert(`Marking number ${num}`);
        }
        
        // Start game
        function startGame() {
            document.getElementById('start-game-btn').textContent = '🎮 GAME ACTIVE';
            document.getElementById('status').textContent = '🎮 PLAYING';
            document.getElementById('start-game-btn').classList.add('ready');
            showMessage('🚀 Game started!', 'success');
        }
        
        // Check bingo
        function checkBingo() {
            alert('🎯 BINGO! Checking with server...');
        }
        
        // Show message
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadCards();
            renderCard97();
            updateSelectedDisplay();
        });
    </script>
</body>
</html>
