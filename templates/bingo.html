<!DOCTYPE html>
<html>
<head>
    <title>Bingo Game - 1000 Cards</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            max-width: 950px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }
        .header h1 { font-size: 32px; }
        .header p { font-size: 14px; opacity: 0.9; }
        #status { 
            display: inline-block;
            padding: 5px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            margin-top: 5px;
        }
        
        /* Connection Status */
        .connection-status {
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-left: 10px;
        }
        .connection-status.error {
            background: #f44336;
        }
        
        /* Info Bar - Round and Players only (Prize Pool removed) */
        .info-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
        }
        .info-item { text-align: center; }
        .info-label { font-size: 12px; opacity: 0.9; }
        .info-value { font-size: 22px; font-weight: bold; }
        
        /* Reconnect Bar */
        .reconnect-bar {
            background: #ff9800;
            color: white;
            padding: 10px;
            text-align: center;
            display: none;
        }
        .reconnect-bar button {
            background: white;
            color: #ff9800;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 10px;
        }
        
        /* Main Content - Stacked Layout */
        .main-content {
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }
        
        /* REMOVED: Selected Cards Section (Your Cards) */
        
        /* MIDDLE SECTION: Card Grid 1-1000 */
        .grid-section {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
        }
        .grid-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .card-grid-container {
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border-radius: 8px;
            padding: 8px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            gap: 2px;
        }
        .card-btn {
            aspect-ratio: 1;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 2px;
            font-size: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .card-btn.selected {
            background: #4CAF50;
            box-shadow: 0 0 0 1px gold;
        }
        .card-btn.taken {
            background: #dc3545;
            opacity: 0.5;
            cursor: not-allowed;
        }
        .card-btn:hover:not(.taken) {
            transform: translateY(-1px);
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .clear-btn {
            background: #dc3545;
            color: white;
        }
        .clear-btn:hover:not(:disabled) {
            background: #c82333;
            transform: translateY(-2px);
        }
        .clear-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* BOTTOM SECTION: Game Area (Two Columns) */
        .game-section {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        
        /* Left Game Column - Called Numbers & Card */
        .game-left {
            flex: 1;
        }
        
        /* Called Numbers */
        .called-numbers-section {
            background: #f0f0f0;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .called-title {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .called-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            min-height: 40px;
            max-height: 100px;
            overflow-y: auto;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .called-badge {
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        /* Last Number */
        .last-number {
            background: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(76,175,80,0.3);
        }
        
        /* Current Card */
        .current-card-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #667eea;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title span {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        /* Card navigation for multiple cards */
        .card-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .card-nav-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 5px 15px;
            cursor: pointer;
            font-size: 14px;
        }
        .card-nav-btn:hover {
            background: #5a67d8;
        }
        .card-nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .card-counter {
            font-size: 14px;
            color: #666;
        }
        
        /* BINGO Grid */
        .bingo-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: center;
        }
        .bingo-header div {
            background: #667eea;
            color: white;
            padding: 5px;
            border-radius: 4px;
        }
        .bingo-grid {
            display: grid !important;
            grid-template-columns: repeat(5, 1fr) !important;
            gap: 6px;
            background: white;
            padding: 8px;
            border-radius: 8px;
        }
        .bingo-cell {
            aspect-ratio: 1;
            background: white;
            border: 2px solid #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .bingo-cell:hover {
            transform: scale(1.03);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .bingo-cell.marked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }
        .bingo-cell.free {
            background: #ffd700;
            border-color: #ffd700;
        }
        
        /* Right Game Column */
        .game-right {
            width: 220px;
        }
        
        /* Balance Display */
        .balance-display {
            background: #e8f5e9;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #4CAF50;
        }
        .balance-amount {
            font-size: 20px;
            color: #4CAF50;
        }
        
        /* REMOVED: Prize Pool Display */
        
        /* Auto-mark */
        .auto-mark {
            margin-bottom: 10px;
            font-size: 13px;
        }
        
        /* Auto-start timer display */
        .auto-start-timer {
            background: #ff9800;
            color: white;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            display: none;
        }
        
        /* BINGO Button */
        .bingo-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }
        .bingo-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(245,87,108,0.4);
        }
        .bingo-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            animation: none;
        }
        
        /* Players List */
        .players-list {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            min-height: 60px;
            max-height: 100px;
            overflow-y: auto;
            font-size: 12px;
            border: 1px solid #ddd;
        }
        .player-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #e0e0e0;
            color: #333;
            border-radius: 20px;
            margin: 3px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #ccc;
        }
        .player-badge.ready {
            background: #4CAF50;
            color: white;
            border-color: #2e7d32;
        }
        .player-badge.winner {
            background: gold;
            color: #333;
            border-color: #b8860b;
            animation: winnerGlow 1s infinite;
        }
        
        /* Winner Announcement */
        .winner-announcement {
            background: linear-gradient(45deg, gold, #ffd700, #ffb347, #ff8c00);
            color: #333;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
            border: 3px solid white;
            box-shadow: 0 0 20px gold;
            display: none;
        }
        .winner-amount {
            font-size: 24px;
            color: #4CAF50;
            background: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }
        
        /* Message */
        .message {
            text-align: center;
            padding: 8px;
            margin: 10px;
            border-radius: 5px;
            display: none;
            font-size: 13px;
            font-weight: bold;
        }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        .message.info { background: #d1ecf1; color: #0c5460; display: block; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        @keyframes winnerGlow {
            0% { box-shadow: 0 0 5px gold; }
            50% { box-shadow: 0 0 15px gold; }
            100% { box-shadow: 0 0 5px gold; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 BINGO</h1>
            <p>Game #<span id="game-id">{{ game_id }}</span> | Player: <span id="player-id">{{ user_id }}</span></p>
            <div>
                <span id="status">⏳ WAITING</span>
                <span id="connection-status" class="connection-status">✅ Connected</span>
            </div>
        </div>
        
        <!-- Info Bar - Round and Players only (Prize Pool removed) -->
        <div class="info-bar">
            <div class="info-item">
                <div class="info-label">Round</div>
                <div class="info-value" id="active-game-display">1</div>
            </div>
            <div class="info-item">
                <div class="info-label">Players</div>
                <div class="info-value" id="player-count">0</div>
            </div>
        </div>
        
        <!-- Reconnect Bar -->
        <div class="reconnect-bar" id="reconnect-bar">
            ⚡ Connection lost. <button onclick="manualReconnect()">Reconnect Now</button>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- REMOVED: Selected Cards Section -->
            
            <!-- Card Grid -->
            <div class="grid-section">
                <div class="grid-title">
                    <span>🎲 Choose Cards (1-1000)</span>
                    <span>{{ price_per_card }} ETB each</span>
                </div>
                <div class="card-grid-container">
                    <div class="card-grid" id="card-grid"></div>
                </div>
                
                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="action-btn clear-btn" id="clear-btn" onclick="clearSelection()">Clear All</button>
                </div>
            </div>
            
            <!-- Game Area -->
            <div class="game-section">
                <!-- Left Column -->
                <div class="game-left">
                    <!-- Winner Announcement -->
                    <div id="winner-announcement" class="winner-announcement">
                        <div id="winner-text"></div>
                        <div class="winner-amount" id="winner-amount"></div>
                    </div>
                    
                    <!-- Called Numbers -->
                    <div class="called-numbers-section">
                        <div class="called-title">📞 CALLED NUMBERS:</div>
                        <div id="called-numbers-list" class="called-list"></div>
                    </div>
                    
                    <!-- Last Number -->
                    <div class="last-number" id="last-number">🎲 Ready</div>
                    
                    <!-- Current Card with Navigation for multiple cards -->
                    <div class="current-card-section">
                        <div class="card-navigation">
                            <button class="card-nav-btn" id="prev-card" onclick="navigateCard(-1)">◀ Prev</button>
                            <span class="card-counter" id="card-counter">Card <span id="current-card-index">1</span>/<span id="total-cards-count">0</span></span>
                            <button class="card-nav-btn" id="next-card" onclick="navigateCard(1)">Next ▶</button>
                        </div>
                        <div class="card-title">
                            Card #<span id="current-card-id">0</span>
                        </div>
                        <div class="bingo-header">
                            <div>B</div>
                            <div>I</div>
                            <div>N</div>
                            <div>G</div>
                            <div>O</div>
                        </div>
                        <div id="card-display" class="bingo-grid"></div>
                    </div>
                </div>
                
                <!-- Right Column -->
                <div class="game-right">
                    <!-- Balance Display -->
                    <div class="balance-display">
                        <div>Your Balance</div>
                        <div class="balance-amount" id="game-balance">{{ initial_balance }} ETB</div>
                    </div>
                    
                    <!-- REMOVED: Prize Pool Display -->
                    
                    <!-- Auto-mark -->
                    <div class="auto-mark">
                        <label>
                            <input type="checkbox" id="autoDaub" onchange="toggleAutoDaub()"> 🤖 Auto-mark
                        </label>
                    </div>
                    
                    <!-- Auto-start timer display -->
                    <div class="auto-start-timer" id="auto-start-timer">
                        ⏱️ Game starting in <span id="timer-seconds">30</span>s
                    </div>
                    
                    <!-- BINGO Button -->
                    <button class="bingo-btn" id="bingo-btn" onclick="checkBingo()" disabled>🎯 CLAIM BINGO!</button>
                    
                    <!-- Players List -->
                    <div class="players-list" id="players-list"></div>
                </div>
            </div>
        </div>
        
        <!-- Message Area -->
        <div id="message" class="message"></div>
    </div>

    <script>
        // Configuration
        const userId = parseInt('{{ user_id }}');
        const gameId = parseInt('{{ game_id }}');
        const pricePerCard = {{ price_per_card }};
        const maxCards = {{ max_cards }};
        const AUTO_START_DELAY = {{ auto_start_delay | default(30) }};
        
        // Game settings
        const TOTAL_NUMBERS = 75;
        const TOTAL_CARDS = 1000;
        const HOUSE_COMMISSION = 0.2; // 20% house fee
        
        // State
        let ws = null;
        let selectedCards = [];
        let myCards = {}; // card_id -> card data
        let myCardIds = []; // array of card IDs for navigation
        let marked = {}; // card_id -> array of marked numbers
        let called = [];
        let players = [];
        let takenCards = new Set();
        let gameStarted = false;
        let gameEnded = false;
        let currentRound = 1;
        let currentWinner = null;
        let currentCardIndex = 0; // Index in myCardIds array
        let currentCardId = null;
        let balance = {{ initial_balance }};
        let activeGames = {{ initial_active_games }};
        let totalStake = {{ initial_stake }};
        let isReady = false;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        let isProcessing = false;
        let autoDaubEnabled = false;
        let roundLocked = false;
        let autoStartTimer = null;
        let autoStartSeconds = AUTO_START_DELAY;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadCards();
            connectWebSocket();
            fetchBalance();
        });
        
        // Fetch balance
        async function fetchBalance() {
            try {
                const response = await fetch(`/api/user/${userId}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && !data.error) {
                        balance = data.balance_etb || balance;
                        activeGames = data.active_games || activeGames;
                        totalStake = data.total_stake_etb || totalStake;
                        updateWallet();
                    }
                }
            } catch (e) {
                console.error('Error fetching balance:', e);
            }
        }
        
        function updateWallet() {
            document.getElementById('game-balance').textContent = balance.toFixed(2) + ' ETB';
        }
        
        // Start auto-start timer
        function startAutoStartTimer() {
            if (autoStartTimer) {
                clearInterval(autoStartTimer);
            }
            
            autoStartSeconds = AUTO_START_DELAY;
            const timerDisplay = document.getElementById('auto-start-timer');
            const timerSpan = document.getElementById('timer-seconds');
            
            timerDisplay.style.display = 'block';
            timerSpan.textContent = autoStartSeconds;
            
            autoStartTimer = setInterval(() => {
                autoStartSeconds--;
                timerSpan.textContent = autoStartSeconds;
                
                if (autoStartSeconds <= 0) {
                    clearInterval(autoStartTimer);
                    timerDisplay.style.display = 'none';
                }
            }, 1000);
        }
        
        // Navigate between multiple cards
        function navigateCard(direction) {
            if (myCardIds.length === 0) return;
            
            currentCardIndex = (currentCardIndex + direction + myCardIds.length) % myCardIds.length;
            currentCardId = myCardIds[currentCardIndex];
            
            document.getElementById('current-card-id').textContent = currentCardId;
            document.getElementById('current-card-index').textContent = currentCardIndex + 1;
            
            // Update navigation buttons
            document.getElementById('prev-card').disabled = myCardIds.length <= 1;
            document.getElementById('next-card').disabled = myCardIds.length <= 1;
            
            renderCurrentCard();
        }
        
        // WebSocket connection
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${gameId}/${userId}`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                console.log('✅ WebSocket connected');
                reconnectAttempts = 0;
                document.getElementById('reconnect-bar').style.display = 'none';
                document.getElementById('connection-status').className = 'connection-status';
                document.getElementById('connection-status').textContent = '✅ Connected';
                showMessage('Connected!', 'success');
            };
            
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                console.log('📩 Received:', data);
                
                if (data.type === 'connected') {
                    takenCards = new Set(data.taken_cards || []);
                    players = data.players || [];
                    gameStarted = data.game_started || false;
                    gameEnded = false;
                    roundLocked = gameStarted;
                    called = data.called_numbers || [];
                    currentRound = data.round || 1;
                    
                    document.getElementById('active-game-display').textContent = currentRound;
                    document.getElementById('player-count').textContent = players.length;
                    updateCardGrid();
                    updatePlayersList();
                    updateCalledNumbers();
                    
                    if (gameStarted) {
                        document.getElementById('status').textContent = '🎮 PLAYING';
                        document.getElementById('bingo-btn').disabled = false;
                        document.getElementById('auto-start-timer').style.display = 'none';
                    }
                    
                    // Start auto-start timer if game hasn't started and there are cards
                    if (!gameStarted && data.auto_start_active) {
                        startAutoStartTimer();
                    }
                }
                else if (data.type === 'your_card') {
                    myCards[data.card_id] = data.card;
                    marked[data.card_id] = data.marked || [];
                    
                    // Add to card IDs array if not already present
                    if (!myCardIds.includes(data.card_id)) {
                        myCardIds.push(data.card_id);
                    }
                    
                    // Update card counter
                    document.getElementById('total-cards-count').textContent = myCardIds.length;
                    
                    // Set current card if this is the first one
                    if (myCardIds.length === 1) {
                        currentCardId = data.card_id;
                        currentCardIndex = 0;
                        document.getElementById('current-card-id').textContent = currentCardId;
                        document.getElementById('current-card-index').textContent = 1;
                    }
                    
                    renderCurrentCard();
                }
                else if (data.type === 'cards_selected') {
                    if (data.success) {
                        showMessage(`✅ ${data.message}`, 'success');
                        if (data.card_ids) {
                            selectedCards = data.card_ids;
                            
                            if (data.new_balance !== undefined && data.new_balance !== null) {
                                balance = data.new_balance / 100;
                                updateWallet();
                                console.log('Balance updated to:', balance);
                            }
                        }
                        
                        // Start auto-start timer on first card selection
                        startAutoStartTimer();
                    } else {
                        showMessage(`❌ ${data.message}`, 'error');
                    }
                    isProcessing = false;
                }
                else if (data.type === 'player_ready') {
                    players = data.players || [];
                    updatePlayersList();
                    document.getElementById('player-count').textContent = players.length;
                }
                else if (data.type === 'game_started') {
                    gameStarted = true;
                    gameEnded = false;
                    roundLocked = true;
                    document.getElementById('status').textContent = '🎮 PLAYING';
                    document.getElementById('bingo-btn').disabled = false;
                    document.getElementById('last-number').textContent = '🎲 Game Started!';
                    document.getElementById('auto-start-timer').style.display = 'none';
                    if (autoStartTimer) {
                        clearInterval(autoStartTimer);
                    }
                    showMessage('🚀 Game started!', 'success');
                }
                else if (data.type === 'number_called') {
                    called = data.called || [];
                    document.getElementById('last-number').textContent = `🎲 ${data.number}`;
                    updateCalledNumbers();
                    renderCurrentCard();
                    
                    if (document.getElementById('autoDaub').checked) {
                        autoMarkNumber(data.number);
                    }
                }
                else if (data.type === 'number_marked') {
                    if (marked[data.card_id]) {
                        marked[data.card_id].push(data.number);
                    }
                    if (currentCardId == data.card_id) {
                        renderCurrentCard();
                    }
                }
                else if (data.type === 'game_won') {
                    gameStarted = false;
                    gameEnded = true;
                    roundLocked = true;
                    currentWinner = data.winner;
                    
                    document.getElementById('status').textContent = '🏆 WINNER!';
                    document.getElementById('bingo-btn').disabled = true;
                    
                    const winnerDiv = document.getElementById('winner-announcement');
                    document.getElementById('winner-text').innerHTML = `🏆 ${data.winner.name} WINS! 🏆`;
                    document.getElementById('winner-amount').textContent = `${data.prize} ETB`;
                    winnerDiv.style.display = 'block';
                    
                    showMessage(`🏆 ${data.winner.name} won!`, 'success');
                    updatePlayersList();
                    fetchBalance();
                    
                    setTimeout(() => {
                        winnerDiv.style.display = 'none';
                    }, 10000);
                }
                else if (data.type === 'game_reset') {
                    gameStarted = false;
                    gameEnded = false;
                    roundLocked = false;
                    called = [];
                    currentWinner = null;
                    
                    selectedCards = [];
                    myCards = {};
                    myCardIds = [];
                    marked = {};
                    isReady = false;
                    takenCards.clear();
                    currentCardIndex = 0;
                    currentCardId = null;
                    
                    document.getElementById('status').textContent = '⏳ WAITING';
                    document.getElementById('bingo-btn').disabled = true;
                    document.getElementById('last-number').textContent = '🎲 Ready';
                    document.getElementById('winner-announcement').style.display = 'none';
                    document.getElementById('auto-start-timer').style.display = 'none';
                    document.getElementById('total-cards-count').textContent = '0';
                    
                    if (autoStartTimer) {
                        clearInterval(autoStartTimer);
                    }
                    
                    currentRound = data.round || currentRound + 1;
                    document.getElementById('active-game-display').textContent = currentRound;
                    
                    updateCardGrid();
                    updateCalledNumbers();
                    updatePlayersList();
                    document.getElementById('current-card-id').textContent = '#0';
                    document.getElementById('card-display').innerHTML = '';
                    
                    showMessage('🔄 New round started!', 'info');
                }
                else if (data.type === 'error') {
                    showMessage(`❌ ${data.message}`, 'error');
                    if (isProcessing) {
                        isProcessing = false;
                    }
                }
            };
            
            ws.onclose = function() {
                console.log('❌ WebSocket disconnected');
                document.getElementById('reconnect-bar').style.display = 'block';
                document.getElementById('connection-status').className = 'connection-status error';
                document.getElementById('connection-status').textContent = '❌ Disconnected';
                
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    const delay = 2000 * Math.pow(2, reconnectAttempts - 1);
                    showMessage(`Reconnecting in ${delay/1000}s...`, 'info');
                    setTimeout(connectWebSocket, delay);
                }
            };
        }
        
        function manualReconnect() {
            reconnectAttempts = 0;
            connectWebSocket();
        }
        
        // Load cards 1-1000
        function loadCards() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= TOTAL_CARDS; i++) {
                const btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.textContent = i;
                btn.onclick = () => toggleCardSelection(i);
                grid.appendChild(btn);
            }
            updateCardGrid();
            console.log(`✅ Loaded ${TOTAL_CARDS} cards`);
        }
        
        // Toggle card selection - Support multiple cards
        function toggleCardSelection(cardId) {
            console.log('Toggling card:', cardId);
            
            if (gameStarted) {
                showMessage('Game already started!', 'error');
                return;
            }
            
            if (gameEnded) {
                showMessage('Game ended! Next round starting soon', 'info');
                return;
            }
            
            if (roundLocked) {
                showMessage('Cards are locked for this round', 'info');
                return;
            }
            
            const index = selectedCards.indexOf(cardId);
            if (index >= 0) {
                // Deselect card
                selectedCards.splice(index, 1);
                console.log('Deselected card:', cardId, 'Remaining:', selectedCards.length);
            } else {
                // Select card
                if (selectedCards.length >= maxCards) {
                    showMessage(`Maximum ${maxCards} cards allowed`, 'error');
                    return;
                }
                
                // Check balance before allowing selection
                const totalCost = (selectedCards.length + 1) * pricePerCard;
                if (totalCost > balance) {
                    showMessage('Insufficient balance! Please deposit.', 'error');
                    return;
                }
                
                if (takenCards.has(cardId)) {
                    showMessage(`Card #${cardId} is already taken by another player`, 'error');
                    return;
                }
                
                selectedCards.push(cardId);
                console.log('Selected card:', cardId, 'Total:', selectedCards.length);
                
                // Auto-send selection to server
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ 
                        type: 'select_cards',
                        card_ids: [cardId]
                    }));
                }
            }
            
            selectedCards.sort((a, b) => a - b);
            updateCardGrid();
        }
        
        function updateCardGrid() {
            document.querySelectorAll('.card-btn').forEach(btn => {
                const id = parseInt(btn.textContent);
                btn.classList.remove('selected', 'taken');
                
                if (selectedCards.includes(id)) {
                    btn.classList.add('selected');
                } else if (takenCards.has(id)) {
                    btn.classList.add('taken');
                }
            });
        }
        
        function clearSelection() {
            if (gameStarted || gameEnded || roundLocked) return;
            selectedCards = [];
            updateCardGrid();
        }
        
        // Render current card
        function renderCurrentCard() {
            if (!currentCardId || !myCards[currentCardId]) {
                return;
            }
            
            const card = myCards[currentCardId];
            const markedNumbers = marked[currentCardId] || [];
            const grid = document.getElementById('card-display');
            
            grid.innerHTML = '';
            
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'bingo-cell';
                    
                    let num = card[col]?.[row] || '?';
                    cell.textContent = num;
                    
                    if (row === 2 && col === 2 || num === 'FREE') {
                        cell.classList.add('free');
                        cell.textContent = 'FREE';
                    }
                    
                    if (called.includes(parseInt(num)) && num !== 'FREE') {
                        cell.classList.add('marked');
                    }
                    
                    if (markedNumbers.includes(parseInt(num))) {
                        cell.classList.add('marked');
                    }
                    
                    cell.onclick = () => markNumber(currentCardId, num);
                    grid.appendChild(cell);
                }
            }
        }
        
        // Mark number on card
        function markNumber(cardId, num) {
            if (!gameStarted || num === 'FREE') return;
            const numInt = parseInt(num);
            if (!called.includes(numInt)) {
                showMessage(`Number ${num} not called yet`, 'error');
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'mark_number',
                card_id: cardId,
                number: numInt
            }));
        }
        
        // Check for BINGO - Winner detection (ONE ROW ONLY)
        function checkBingo() {
            if (!gameStarted || !currentCardId) return;
            
            // Check if current card has bingo (ONE ROW ONLY)
            const card = myCards[currentCardId];
            const markedNumbers = marked[currentCardId] || [];
            
            // Check ONLY rows for winner
            for (let row = 0; row < 5; row++) {
                let rowComplete = true;
                for (let col = 0; col < 5; col++) {
                    const val = card[col][row];
                    if (val !== 'FREE' && !markedNumbers.includes(val) && !called.includes(val)) {
                        rowComplete = false;
                        break;
                    }
                }
                if (rowComplete) {
                    claimBingo(currentCardId);
                    return;
                }
            }
            
            showMessage('No complete row on this card yet!', 'error');
        }
        
        // Claim BINGO
        function claimBingo(cardId) {
            showMessage('🎯 BINGO claimed! Verifying...', 'info');
            ws.send(JSON.stringify({
                type: 'claim_bingo',
                card_id: cardId
            }));
        }
        
        function updateCalledNumbers() {
            const list = document.getElementById('called-numbers-list');
            if (!list) return;
            
            list.innerHTML = '';
            
            if (called && called.length > 0) {
                called.forEach(num => {
                    const badge = document.createElement('span');
                    badge.className = 'called-badge';
                    badge.textContent = num;
                    list.appendChild(badge);
                });
            } else {
                const badge = document.createElement('span');
                badge.className = 'called-badge';
                badge.style.background = '#999';
                badge.textContent = 'No numbers yet';
                list.appendChild(badge);
            }
        }
        
        function updatePlayersList() {
            const list = document.getElementById('players-list');
            if (!list) return;
            
            list.innerHTML = '';
            
            if (players && players.length > 0) {
                players.forEach(p => {
                    const badge = document.createElement('span');
                    badge.className = 'player-badge';
                    if (p.ready) badge.classList.add('ready');
                    if (p.winner) badge.classList.add('winner');
                    
                    let displayName = p.name;
                    if (p.id == userId) displayName += ' (You)';
                    if (p.card_count) displayName += ` [${p.card_count}]`;
                    
                    badge.textContent = displayName;
                    list.appendChild(badge);
                });
            } else {
                const badge = document.createElement('span');
                badge.className = 'player-badge';
                badge.style.background = '#999';
                badge.textContent = 'No players yet';
                list.appendChild(badge);
            }
        }
        
        function autoMarkNumber(number) {
            const num = parseInt(number);
            Object.keys(myCards).forEach(cardId => {
                const card = myCards[cardId];
                for (let col = 0; col < 5; col++) {
                    for (let row = 0; row < 5; row++) {
                        if (card[col]?.[row] === num && !marked[cardId].includes(num)) {
                            ws.send(JSON.stringify({
                                type: 'mark_number',
                                card_id: parseInt(cardId),
                                number: num
                            }));
                            return;
                        }
                    }
                }
            });
        }
        
        function toggleAutoDaub() {
            autoDaubEnabled = document.getElementById('autoDaub').checked;
            showMessage(autoDaubEnabled ? 'Auto-mark ON' : 'Auto-mark OFF', 'info');
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => {
                msg.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
