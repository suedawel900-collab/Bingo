<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Game - 2 Second Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .game-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .game-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .game-header h1 {
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .game-header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .speed-badge {
            background: #ffd700;
            color: #333;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        
        .timer-info {
            background: #e9ecef;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            color: #495057;
            border-bottom: 1px solid #dee2e6;
        }
        
        .timer-info span {
            font-weight: bold;
            color: #dc3545;
        }
        
        .last-number {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            animation: numberPop 0.5s ease;
        }
        
        @keyframes numberPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .numbers-left {
            font-size: 16px;
            margin-top: 5px;
            opacity: 0.9;
        }
        
        .bingo-card {
            padding: 20px;
            background: white;
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .card-cell {
            aspect-ratio: 1;
            background: white;
            border: 3px solid #e9ecef;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .card-cell:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .card-cell.marked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
            animation: markPop 0.2s ease;
        }
        
        @keyframes markPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .card-cell.free {
            background: #ffd700;
            border-color: #ffd700;
            color: #333;
            font-size: 14px;
        }
        
        .card-cell.free.marked {
            background: #ffd700;
            color: #333;
        }
        
        .card-cell.just-called {
            animation: calledFlash 1s ease;
        }
        
        @keyframes calledFlash {
            0% { background-color: #ffd700; }
            100% { background-color: white; }
        }
        
        .card-cell.marked.just-called {
            animation: markedFlash 1s ease;
        }
        
        @keyframes markedFlash {
            0% { background-color: #ffd700; }
            100% { background-color: #4CAF50; }
        }
        
        .bingo-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 50px;
            font-size: 28px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.3);
            margin-top: 20px;
        }
        
        .bingo-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(245, 87, 108, 0.4);
        }
        
        .bingo-button:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .bingo-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .bingo-button.winner {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }
        
        .status-message {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 12px;
            font-weight: 500;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        .status-message.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            display: block;
        }
        
        .players-list {
            padding: 20px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
        }
        
        .players-title {
            font-size: 14px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        
        .player-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .player-badge {
            background: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 14px;
            color: #333;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .player-badge.winner {
            background: #ffd700;
            border-color: #ffd700;
            color: #333;
            font-weight: bold;
            animation: glow 1s ease infinite;
        }
        
        @keyframes glow {
            0% { box-shadow: 0 0 5px #ffd700; }
            50% { box-shadow: 0 0 20px #ffd700; }
            100% { box-shadow: 0 0 5px #ffd700; }
        }
        
        .back-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
            font-weight: 500;
        }
        
        .back-button:hover {
            background: #5a6268;
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        
        .spinner {
            border: 4px solid rgba(0,0,0,0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .game-header h1 {
                font-size: 28px;
            }
            
            .info-value {
                font-size: 20px;
            }
            
            .card-cell {
                font-size: 16px;
            }
            
            .bingo-button {
                font-size: 20px;
                padding: 15px;
            }
            
            .last-number {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🎯 BINGO</h1>
            <p>Game #<span id="game-id">{{ game_id }}</span> | Player ID: {{ user_id }}</p>
            <div class="speed-badge">⚡ 2 SECOND CALLS ⚡</div>
        </div>
        
        <div class="game-info">
            <div class="info-item">
                <div class="info-label">Players</div>
                <div class="info-value" id="player-count">1</div>
            </div>
            <div class="info-item">
                <div class="info-label">Prize Pool</div>
                <div class="info-value" id="prize-pool">20 ETB</div>
            </div>
            <div class="info-item">
                <div class="info-label">Called</div>
                <div class="info-value" id="called-count">0</div>
            </div>
        </div>
        
        <div class="timer-info">
            ⏱️ Next number in <span id="countdown">2</span> seconds | <span id="numbers-left">75</span> numbers left
        </div>
        
        <div class="last-number" id="last-number">
            🎲 Ready...
        </div>
        
        <div class="bingo-card">
            <div class="card-grid" id="bingo-card">
                <!-- Card will be generated by JavaScript -->
            </div>
            
            <div id="status-message" class="status-message"></div>
            
            <button class="bingo-button" id="bingo-button" onclick="checkBingo()">
                🎯 BINGO!
            </button>
            
            <a href="https://t.me/your_bot" class="back-button">◀️ Back to Bot</a>
        </div>
        
        <div class="players-list">
            <div class="players-title">Players in this game:</div>
            <div class="player-badges" id="players-list">
                <span class="player-badge">You</span>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CALL_INTERVAL = 2000; // 2 seconds
        const TOTAL_NUMBERS = 75;
        
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = parseInt(urlParams.get('user_id') || '{{ user_id }}');
        const gameId = parseInt(urlParams.get('game_id') || '{{ game_id }}');
        
        console.log('🎯 Bingo Game Starting - 2 Second Edition');
        console.log(`📊 Game #${gameId} for Player #${userId}`);
        
        // Game state
        let card = [];
        let markedNumbers = [];
        let calledNumbers = [];
        let players = [];
        let gameActive = true;
        let winner = null;
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        let countdownInterval = null;
        let nextNumberTime = 2;
        
        // Generate random bingo card
        function generateCard() {
            const columns = [
                { letter: 'B', min: 1, max: 15 },
                { letter: 'I', min: 16, max: 30 },
                { letter: 'N', min: 31, max: 45 },
                { letter: 'G', min: 46, max: 60 },
                { letter: 'O', min: 61, max: 75 }
            ];
            
            const newCard = [];
            
            for (let col = 0; col < 5; col++) {
                const column = [];
                const numbers = new Set();
                
                while (numbers.size < 5) {
                    const num = Math.floor(Math.random() * (columns[col].max - columns[col].min + 1)) + columns[col].min;
                    numbers.add(num);
                }
                
                column.push(...Array.from(numbers));
                newCard.push(column);
            }
            
            // Free space in center
            newCard[2][2] = 'FREE';
            
            return newCard;
        }
        
        // Render bingo card
        function renderCard() {
            const cardGrid = document.getElementById('bingo-card');
            if (!cardGrid) return;
            
            cardGrid.innerHTML = '';
            
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'card-cell';
                    
                    const number = card[col][row];
                    cell.textContent = number;
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.dataset.number = number;
                    
                    if (number === 'FREE') {
                        cell.classList.add('free', 'marked');
                    } else if (markedNumbers.includes(number)) {
                        cell.classList.add('marked');
                    }
                    
                    cell.onclick = () => markNumber(number);
                    cardGrid.appendChild(cell);
                }
            }
        }
        
        // Mark number on card
        function markNumber(number) {
            if (number === 'FREE' || !gameActive || winner) return;
            
            if (!markedNumbers.includes(number) && calledNumbers.includes(number)) {
                markedNumbers.push(number);
                renderCard();
                
                // Send to server
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'mark_number',
                        number: number
                    }));
                }
                
                // Play sound effect (if browser supports it)
                playSound('mark');
                
                // Check for bingo after marking
                if (checkBingo()) {
                    declareBingo();
                }
            }
        }
        
        // Check if player has bingo
        function checkBingo() {
            // Check rows
            for (let row = 0; row < 5; row++) {
                let bingo = true;
                for (let col = 0; col < 5; col++) {
                    const num = card[col][row];
                    if (num !== 'FREE' && !markedNumbers.includes(num)) {
                        bingo = false;
                        break;
                    }
                }
                if (bingo) return true;
            }
            
            // Check columns
            for (let col = 0; col < 5; col++) {
                let bingo = true;
                for (let row = 0; row < 5; row++) {
                    const num = card[col][row];
                    if (num !== 'FREE' && !markedNumbers.includes(num)) {
                        bingo = false;
                        break;
                    }
                }
                if (bingo) return true;
            }
            
            // Check diagonals
            let diag1 = true;
            let diag2 = true;
            for (let i = 0; i < 5; i++) {
                const num1 = card[i][i];
                const num2 = card[4-i][i];
                
                if (num1 !== 'FREE' && !markedNumbers.includes(num1)) diag1 = false;
                if (num2 !== 'FREE' && !markedNumbers.includes(num2)) diag2 = false;
            }
            
            return diag1 || diag2;
        }
        
        // Declare bingo
        async function declareBingo() {
            if (!gameActive || winner) return;
            
            gameActive = false;
            showStatus('🎉 BINGO! Checking with server...', 'info');
            playSound('bingo');
            
            try {
                const response = await fetch('/api/check-bingo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: gameId,
                        card: card,
                        marked: markedNumbers
                    })
                });
                
                const result = await response.json();
                
                if (result.valid) {
                    showStatus('🎉 CONGRATULATIONS! You won! 🎉', 'success');
                    document.getElementById('bingo-button').disabled = true;
                    document.getElementById('bingo-button').classList.add('winner');
                    document.getElementById('bingo-button').textContent = '🏆 YOU WON! 🏆';
                    playSound('win');
                } else {
                    showStatus('❌ Not a valid BINGO!', 'error');
                    gameActive = true;
                }
                
            } catch (error) {
                console.error('Error checking bingo:', error);
                showStatus('Error checking BINGO', 'error');
                gameActive = true;
            }
        }
        
        // Show status message
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status-message');
            if (!statusDiv) return;
            
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type}`;
            
            // Auto hide after 3 seconds for non-error messages
            if (type !== 'error') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 3000);
            }
        }
        
        // Play sound effects (simple beep using Web Audio API)
        function playSound(type) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                if (type === 'call') {
                    oscillator.frequency.value = 440; // A4
                    gainNode.gain.value = 0.1;
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.1);
                } else if (type === 'mark') {
                    oscillator.frequency.value = 523.25; // C5
                    gainNode.gain.value = 0.1;
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.05);
                } else if (type === 'bingo') {
                    oscillator.frequency.value = 659.25; // E5
                    gainNode.gain.value = 0.2;
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.3);
                } else if (type === 'win') {
                    oscillator.frequency.value = 880; // A5
                    gainNode.gain.value = 0.3;
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.5);
                }
            } catch (e) {
                // Ignore audio errors
            }
        }
        
        // Connect to WebSocket
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/${gameId}/${userId}`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('✅ WebSocket connected');
                reconnectAttempts = 0;
                showStatus('Connected! Numbers called every 2 seconds ⚡', 'success');
                
                // Start countdown
                startCountdown();
                
                // Join game
                fetch('/api/join-game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: gameId,
                        card: card
                    })
                }).then(res => res.json()).then(data => {
                    if (data.success) {
                        console.log('✅ Joined game successfully');
                        showStatus('Game joined! Waiting for numbers...', 'info');
                    } else {
                        showStatus('Failed to join game: ' + (data.error || 'Unknown error'), 'error');
                    }
                }).catch(err => {
                    console.error('Join game error:', err);
                });
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('📩 WebSocket message:', data);
                
                if (data.type === 'number_called') {
                    onNumberCalled(data);
                } else if (data.type === 'player_joined') {
                    onPlayerJoined(data);
                } else if (data.type === 'game_won') {
                    onGameWon(data);
                } else if (data.type === 'game_over') {
                    onGameOver(data);
                } else if (data.type === 'number_marked') {
                    // Number marked successfully
                } else if (data.type === 'bingo_result') {
                    // Bingo check result
                }
            };
            
            ws.onclose = () => {
                console.log('❌ WebSocket disconnected');
                if (gameActive) {
                    reconnect();
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                showStatus('Connection error', 'error');
            };
        }
        
        // Reconnect WebSocket
        function reconnect() {
            if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                showStatus(`Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})`, 'warning');
                
                setTimeout(() => {
                    connectWebSocket();
                }, 2000 * reconnectAttempts);
            } else {
                showStatus('Unable to connect to server', 'error');
            }
        }
        
        // Start countdown timer
        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            
            nextNumberTime = 2;
            document.getElementById('countdown').textContent = nextNumberTime;
            
            countdownInterval = setInterval(() => {
                nextNumberTime--;
                document.getElementById('countdown').textContent = nextNumberTime;
                
                if (nextNumberTime <= 0) {
                    nextNumberTime = 2;
                }
            }, 1000);
        }
        
        // Handle number called
        function onNumberCalled(data) {
            calledNumbers.push(data.number);
            
            // Update UI
            document.getElementById('last-number').textContent = `🎲 ${data.number}`;
            document.getElementById('called-count').textContent = calledNumbers.length;
            document.getElementById('numbers-left').textContent = data.numbers_left || (TOTAL_NUMBERS - calledNumbers.length);
            
            // Highlight the number on card if it exists
            for (let col = 0; col < 5; col++) {
                for (let row = 0; row < 5; row++) {
                    if (card[col][row] === data.number) {
                        // Flash the cell
                        const cells = document.querySelectorAll('.card-cell');
                        cells.forEach(cell => {
                            if (cell.textContent == data.number) {
                                cell.classList.add('just-called');
                                setTimeout(() => {
                                    cell.classList.remove('just-called');
                                }, 1000);
                            }
                        });
                        
                        showStatus(`✅ Number ${data.number} is on your card!`, 'success');
                        playSound('mark');
                        break;
                    }
                }
            }
            
            // Play sound
            playSound('call');
        }
        
        // Handle player joined
        function onPlayerJoined(data) {
            players = data.players;
            updatePlayersList();
            document.getElementById('player-count').textContent = players.length;
            
            if (data.prize_pool) {
                document.getElementById('prize-pool').textContent = `${data.prize_pool} ETB`;
            }
            
            if (data.player_id !== userId) {
                showStatus(`👋 Player joined the game! Total: ${players.length}`, 'info');
                playSound('call');
            }
        }
        
        // Handle game won
        function onGameWon(data) {
            gameActive = false;
            winner = data.winner_id;
            
            document.getElementById('bingo-button').disabled = true;
            
            if (data.winner_id == userId) {
                document.getElementById('bingo-button').classList.add('winner');
                document.getElementById('bingo-button').textContent = '🏆 YOU WON! 🏆';
                showStatus('🏆 CONGRATULATIONS! You won! 🏆', 'success');
                playSound('win');
            } else {
                document.getElementById('bingo-button').textContent = '👑 GAME OVER';
                showStatus(`👑 ${data.winner_name} won! Prize: ${data.prize}`, 'info');
                playSound('bingo');
            }
            
            // Update prize pool
            if (data.prize) {
                document.getElementById('prize-pool').textContent = data.prize;
            }
            
            // Update players list to show winner
            updatePlayersList();
        }
        
        // Handle game over
        function onGameOver(data) {
            gameActive = false;
            showStatus(data.message, 'warning');
            document.getElementById('bingo-button').disabled = true;
            document.getElementById('bingo-button').textContent = '🎲 GAME OVER';
            playSound('bingo');
        }
        
        // Update players list
        function updatePlayersList() {
            const container = document.getElementById('players-list');
            if (!container) return;
            
            container.innerHTML = '';
            
            if (players.length === 0) {
                container.innerHTML = '<span class="player-badge">You</span>';
                return;
            }
            
            players.forEach(player => {
                const badge = document.createElement('span');
                badge.className = 'player-badge';
                badge.textContent = player.name;
                
                if (player.is_winner || player.id === winner) {
                    badge.classList.add('winner');
                    badge.textContent += ' 👑';
                }
                
                if (player.id === userId) {
                    badge.textContent += ' (You)';
                }
                
                container.appendChild(badge);
            });
        }
        
        // Initialize game
        function initGame() {
            // Generate card
            card = generateCard();
            renderCard();
            console.log('🎴 Bingo card generated:', card);
            
            // Connect WebSocket
            connectWebSocket();
        }
        
        // Start game when page loads
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
