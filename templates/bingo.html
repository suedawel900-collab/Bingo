<!DOCTYPE html>
<html>
<head>
    <title>Bingo Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .game-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { font-size: 32px; margin-bottom: 5px; }
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }
        .status.waiting { background: #ff9800; color: white; }
        .status.admin { background: #ffd700; color: #333; }
        .status.playing { background: #4CAF50; color: white; }
        
        /* Card Selection */
        .selection {
            padding: 20px;
        }
        .selection h2 { text-align: center; margin-bottom: 15px; }
        .players-ready {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .card-btn {
            aspect-ratio: 1;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .card-btn.taken {
            background: #dc3545;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .card-btn.selected {
            background: #4CAF50;
            transform: scale(1.1);
        }
        .preview {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        .preview-cell {
            aspect-ratio: 1;
            background: white;
            border: 2px solid #ddd;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .preview-cell.free { background: #ffd700; }
        .confirm-btn {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .confirm-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Game Screen */
        .game-screen {
            display: none;
            padding: 20px;
        }
        .info-bar {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .info-item { text-align: center; }
        .info-label { font-size: 12px; color: #666; }
        .info-value { font-size: 24px; font-weight: bold; color: #667eea; }
        .last-number {
            background: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .bingo-card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .card-cell {
            aspect-ratio: 1;
            background: white;
            border: 3px solid #ddd;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .card-cell.marked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }
        .card-cell.free {
            background: #ffd700;
            border-color: #ffd700;
        }
        .bingo-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .start-btn {
            width: 100%;
            padding: 15px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .players-list {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        .player-badge {
            display: inline-block;
            padding: 5px 10px;
            background: white;
            border-radius: 20px;
            margin: 3px;
            font-size: 12px;
            border: 2px solid #ddd;
        }
        .back-btn {
            display: block;
            text-align: center;
            padding: 12px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
        }
        .message {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        .message.info { background: #d1ecf1; color: #0c5460; display: block; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🎯 BINGO</h1>
            <p>Game #<span id="game-id">{{ game_id }}</span> | Player: <span id="player-id">{{ user_id }}</span></p>
            <div id="status" class="status waiting">⏳ WAITING</div>
        </div>
        
        <!-- Card Selection -->
        <div id="selection" class="selection">
            <h2>Choose Your Card</h2>
            <div class="players-ready">
                Players Ready: <span id="ready-count">0</span>/<span id="total-players">0</span>
            </div>
            <div id="card-grid" class="card-grid"></div>
            
            <div id="preview" class="preview">
                <div style="text-align: center; font-weight: bold;">Card #<span id="preview-id"></span></div>
                <div id="preview-grid" class="preview-grid"></div>
            </div>
            
            <button class="confirm-btn" id="confirm-btn" disabled onclick="confirmCard()">
                Confirm Selection
            </button>
        </div>
        
        <!-- Game Screen -->
        <div id="game" class="game-screen">
            <div class="info-bar">
                <div class="info-item">
                    <div class="info-label">Players</div>
                    <div class="info-value" id="game-players">1</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Prize</div>
                    <div class="info-value" id="prize-pool">20 ETB</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Called</div>
                    <div class="info-value" id="called-count">0</div>
                </div>
            </div>
            
            <div class="last-number" id="last-number">🎲 Ready</div>
            
            <div id="card-display" class="bingo-card"></div>
            
            <button class="bingo-btn" id="bingo-btn" onclick="checkBingo()" disabled>
                🎯 BINGO!
            </button>
            
            <div id="admin-controls" style="display: none;">
                <button class="start-btn" onclick="startGame()">🚀 START GAME</button>
            </div>
            
            <div class="players-list" id="players-list"></div>
            
            <a href="https://t.me/Treeeeestbot" class="back-btn">◀️ Back to @Treeeeestbot</a>
        </div>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        // Configuration
        const userId = {{ user_id }};
        const gameId = {{ game_id }};
        const adminId = {{ admin_id }};
        const isAdmin = (userId == adminId);
        
        // State
        let ws = null;
        let selectedCard = null;
        let currentCard = null;
        let marked = [];
        let called = [];
        let players = [];
        let takenCards = new Set();
        let gameStarted = false;
        
        // Initialize
        loadCards();
        connectWebSocket();
        
        if (isAdmin) {
            document.getElementById('admin-controls').style.display = 'block';
            document.getElementById('status').className = 'status admin';
            document.getElementById('status').textContent = '👑 ADMIN';
        }
        
        // WebSocket connection
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${gameId}/${userId}`);
            
            ws.onopen = () => {
                console.log('✅ Connected');
                showMessage('Connected!', 'success');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('📩', data);
                
                if (data.type === 'connected') {
                    takenCards = new Set(data.taken_cards || []);
                    players = data.players || [];
                    updateCardGrid();
                    updatePlayersList();
                }
                else if (data.type === 'player_joined') {
                    players = data.players || [];
                    takenCards = new Set(data.taken_cards || []);
                    updatePlayersList();
                    updateCardGrid();
                    document.getElementById('total-players').textContent = players.length;
                }
                else if (data.type === 'card_taken') {
                    takenCards = new Set(data.taken_cards || []);
                    updateCardGrid();
                }
                else if (data.type === 'card_selected' && data.success) {
                    showMessage(`✅ Card #${data.card_id} selected!`, 'success');
                }
                else if (data.type === 'your_card') {
                    currentCard = data.card;
                    selectedCard = data.card_id;
                    showGame();
                }
                else if (data.type === 'game_started') {
                    gameStarted = true;
                    document.getElementById('status').className = 'status playing';
                    document.getElementById('status').textContent = '🎮 PLAYING';
                    document.getElementById('bingo-btn').disabled = false;
                    showMessage('🚀 Game started!', 'success');
                }
                else if (data.type === 'number_called') {
                    called = data.called || [];
                    document.getElementById('last-number').textContent = `🎲 ${data.number}`;
                    document.getElementById('called-count').textContent = called.length;
                }
                else if (data.type === 'error') {
                    showMessage(`❌ ${data.message}`, 'error');
                }
            };
            
            ws.onclose = () => {
                console.log('❌ Disconnected');
                setTimeout(connectWebSocket, 3000);
            };
        }
        
        // Load cards
        async function loadCards() {
            const res = await fetch('/api/cards');
            const data = await res.json();
            
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            
            data.cards.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'card-btn';
                btn.textContent = c.id;
                btn.onclick = () => previewCard(c.id);
                grid.appendChild(btn);
            });
        }
        
        // Preview card
        async function previewCard(cardId) {
            if (takenCards.has(cardId)) {
                showMessage(`❌ Card #${cardId} is taken!`, 'error');
                return;
            }
            
            selectedCard = cardId;
            document.querySelectorAll('.card-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.textContent == cardId) btn.classList.add('selected');
            });
            
            const res = await fetch(`/api/card/${cardId}`);
            const card = await res.json();
            
            const preview = document.getElementById('preview-grid');
            preview.innerHTML = '';
            
            for (let row = 0; row < 2; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'preview-cell';
                    const val = card.card[col][row];
                    cell.textContent = val;
                    if (val === 'FREE') cell.classList.add('free');
                    preview.appendChild(cell);
                }
            }
            
            document.getElementById('preview-id').textContent = cardId;
            document.getElementById('preview').style.display = 'block';
            document.getElementById('confirm-btn').disabled = false;
        }
        
        // Confirm card
        function confirmCard() {
            if (!selectedCard) return;
            
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showMessage('❌ Not connected', 'error');
                return;
            }
            
            ws.send(JSON.stringify({
                type: 'select_card',
                card_id: selectedCard
            }));
            
            document.getElementById('confirm-btn').disabled = true;
        }
        
        // Show game screen
        function showGame() {
            document.getElementById('selection').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            
            // Render card
            const cardDiv = document.getElementById('card-display');
            cardDiv.innerHTML = '';
            
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'card-cell';
                    const num = currentCard[col][row];
                    cell.textContent = num;
                    
                    if (num === 'FREE') {
                        cell.classList.add('free', 'marked');
                    } else if (marked.includes(num)) {
                        cell.classList.add('marked');
                    }
                    
                    cell.onclick = () => markNumber(num);
                    cardDiv.appendChild(cell);
                }
            }
            
            // Join game
            fetch('/api/join-game', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, game_id: gameId})
            });
        }
        
        // Mark number
        function markNumber(num) {
            if (!gameStarted || num === 'FREE') return;
            if (!called.includes(num)) return;
            if (marked.includes(num)) return;
            
            marked.push(num);
            showGame(); // Re-render
        }
        
        // Check bingo
        function checkBingo() {
            // Simple bingo check
            let hasBingo = false;
            
            // Check rows
            for (let row = 0; row < 5; row++) {
                let rowBingo = true;
                for (let col = 0; col < 5; col++) {
                    const num = currentCard[col][row];
                    if (num !== 'FREE' && !marked.includes(num)) {
                        rowBingo = false;
                        break;
                    }
                }
                if (rowBingo) hasBingo = true;
            }
            
            // Check columns
            for (let col = 0; col < 5; col++) {
                let colBingo = true;
                for (let row = 0; row < 5; row++) {
                    const num = currentCard[col][row];
                    if (num !== 'FREE' && !marked.includes(num)) {
                        colBingo = false;
                        break;
                    }
                }
                if (colBingo) hasBingo = true;
            }
            
            if (hasBingo) {
                alert('🎉 BINGO! You win!');
            } else {
                showMessage('No BINGO yet!', 'info');
            }
        }
        
        // Start game (admin only)
        function startGame() {
            if (!isAdmin) return;
            ws.send(JSON.stringify({type: 'start_game'}));
        }
        
        // Update card grid
        function updateCardGrid() {
            document.querySelectorAll('.card-btn').forEach(btn => {
                const id = parseInt(btn.textContent);
                if (takenCards.has(id)) {
                    btn.classList.add('taken');
                } else {
                    btn.classList.remove('taken');
                }
            });
            
            const ready = players.filter(p => p.card_id).length;
            document.getElementById('ready-count').textContent = ready;
            document.getElementById('total-players').textContent = players.length;
        }
        
        // Update players list
        function updatePlayersList() {
            const list = document.getElementById('players-list');
            list.innerHTML = '<div style="margin-bottom: 10px;">Players:</div>';
            
            players.forEach(p => {
                const badge = document.createElement('span');
                badge.className = 'player-badge';
                badge.textContent = p.name;
                if (p.card_id) badge.textContent += ` (#${p.card_id})`;
                if (p.id == userId) badge.textContent += ' (You)';
                list.appendChild(badge);
            });
        }
        
        // Show message
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => msg.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
