<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .game-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .game-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .game-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .game-info {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .last-number {
            background: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 36px;
            font-weight: bold;
        }
        
        .bingo-card {
            padding: 20px;
            background: white;
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .card-cell {
            aspect-ratio: 1;
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .card-cell.marked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
            transform: scale(0.95);
        }
        
        .card-cell.free {
            background: #ffd700;
            border-color: #ffd700;
            color: #333;
        }
        
        .card-cell:active {
            transform: scale(0.9);
        }
        
        .bingo-button {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }
        
        .bingo-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
        }
        
        .bingo-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-message {
            text-align: center;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: none;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }
        
        .players-list {
            padding: 15px;
            background: #f8f9fa;
            border-top: 1px solid #eee;
        }
        
        .players-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .player-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .player-badge {
            background: #e9ecef;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #495057;
        }
        
        .player-badge.winner {
            background: #ffd700;
            color: #333;
            font-weight: bold;
        }
        
        @media (max-width: 480px) {
            .card-cell {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🎯 BINGO</h1>
            <p>Game #<span id="game-id">1234</span></p>
        </div>
        
        <div class="game-info">
            <div class="info-item">
                <div class="info-label">Players</div>
                <div class="info-value" id="player-count">1</div>
            </div>
            <div class="info-item">
                <div class="info-label">Prize</div>
                <div class="info-value" id="prize-pool">$10</div>
            </div>
            <div class="info-item">
                <div class="info-label">Called</div>
                <div class="info-value" id="called-count">0</div>
            </div>
        </div>
        
        <div class="last-number" id="last-number">
            🎲 Waiting...
        </div>
        
        <div class="bingo-card">
            <div class="card-grid" id="bingo-card">
                <!-- Card will be generated by JavaScript -->
            </div>
            
            <div id="status-message" class="status-message"></div>
            
            <button class="bingo-button" id="bingo-button" onclick="checkBingo()">
                🎯 BINGO!
            </button>
        </div>
        
        <div class="players-list">
            <div class="players-title">Players in this game:</div>
            <div class="player-badges" id="players-list">
                <span class="player-badge">You</span>
            </div>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        const gameId = urlParams.get('game_id') || '1';
        
        // Game state
        let card = [];
        let markedNumbers = [];
        let calledNumbers = [];
        let players = [];
        let gameActive = true;
        
        // Generate random bingo card
        function generateCard() {
            const card = [];
            const columns = [
                { letter: 'B', min: 1, max: 15 },
                { letter: 'I', min: 16, max: 30 },
                { letter: 'N', min: 31, max: 45 },
                { letter: 'G', min: 46, max: 60 },
                { letter: 'O', min: 61, max: 75 }
            ];
            
            for (let col = 0; col < 5; col++) {
                const column = [];
                const numbers = new Set();
                
                while (numbers.size < 5) {
                    const num = Math.floor(Math.random() * (columns[col].max - columns[col].min + 1)) + columns[col].min;
                    numbers.add(num);
                }
                
                card.push(Array.from(numbers));
            }
            
            // Free space in center
            card[2][2] = 'FREE';
            
            return card;
        }
        
        // Render bingo card
        function renderCard() {
            const cardGrid = document.getElementById('bingo-card');
            cardGrid.innerHTML = '';
            
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'card-cell';
                    
                    const number = card[col][row];
                    cell.textContent = number;
                    
                    if (number === 'FREE') {
                        cell.classList.add('free', 'marked');
                    } else if (markedNumbers.includes(number)) {
                        cell.classList.add('marked');
                    }
                    
                    cell.onclick = () => markNumber(number);
                    cardGrid.appendChild(cell);
                }
            }
        }
        
        // Mark number
        function markNumber(number) {
            if (number === 'FREE' || !gameActive) return;
            
            if (!markedNumbers.includes(number) && calledNumbers.includes(number)) {
                markedNumbers.push(number);
                renderCard();
                
                // Send to server
                fetch('/api/mark-number', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: gameId,
                        number: number
                    })
                });
            }
        }
        
        // Check for bingo
        function checkBingo() {
            if (!gameActive) return;
            
            // Check rows
            for (let row = 0; row < 5; row++) {
                let bingo = true;
                for (let col = 0; col < 5; col++) {
                    const num = card[col][row];
                    if (num !== 'FREE' && !markedNumbers.includes(num)) {
                        bingo = false;
                        break;
                    }
                }
                if (bingo) {
                    declareBingo();
                    return;
                }
            }
            
            // Check columns
            for (let col = 0; col < 5; col++) {
                let bingo = true;
                for (let row = 0; row < 5; row++) {
                    const num = card[col][row];
                    if (num !== 'FREE' && !markedNumbers.includes(num)) {
                        bingo = false;
                        break;
                    }
                }
                if (bingo) {
                    declareBingo();
                    return;
                }
            }
            
            // Check diagonals
            let diag1 = true;
            let diag2 = true;
            
            for (let i = 0; i < 5; i++) {
                const num1 = card[i][i];
                const num2 = card[4-i][i];
                
                if (num1 !== 'FREE' && !markedNumbers.includes(num1)) diag1 = false;
                if (num2 !== 'FREE' && !markedNumbers.includes(num2)) diag2 = false;
            }
            
            if (diag1 || diag2) {
                declareBingo();
                return;
            }
            
            // No bingo
            showStatus('No BINGO yet! Keep playing...', 'info');
        }
        
        // Declare bingo
        async function declareBingo() {
            gameActive = false;
            
            showStatus('🎉 BINGO! Checking with server...', 'info');
            
            try {
                const response = await fetch('/api/check-bingo', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        game_id: gameId,
                        card: card,
                        marked: markedNumbers
                    })
                });
                
                const result = await response.json();
                
                if (result.valid) {
                    showStatus('🎉 CONGRATULATIONS! You won! 🎉', 'success');
                    document.getElementById('bingo-button').disabled = true;
                } else {
                    showStatus('❌ Not a valid BINGO!', 'error');
                    gameActive = true;
                }
                
            } catch (error) {
                showStatus('Error checking BINGO', 'error');
                gameActive = true;
            }
        }
        
        // Show status message
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type}`;
            
            setTimeout(() => {
                if (statusDiv.className.includes(type)) {
                    statusDiv.style.display = 'none';
                }
            }, 3000);
        }
        
        // Connect to WebSocket for real-time updates
        function connectWebSocket() {
            const ws = new WebSocket(`wss://${window.location.host}/ws/${gameId}/${userId}`);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'number_called') {
                    calledNumbers.push(data.number);
                    document.getElementById('last-number').textContent = `🎲 ${data.number}`;
                    document.getElementById('called-count').textContent = calledNumbers.length;
                    
                    if (markedNumbers.includes(data.number)) {
                        // Your number was called!
                        showStatus(`✅ Number ${data.number} is on your card!`, 'success');
                    }
                    
                } else if (data.type === 'player_joined') {
                    players = data.players;
                    updatePlayersList();
                    document.getElementById('player-count').textContent = players.length;
                    
                } else if (data.type === 'game_won') {
                    gameActive = false;
                    document.getElementById('bingo-button').disabled = true;
                    
                    if (data.winner_id == userId) {
                        showStatus('🏆 YOU WON! 🏆', 'success');
                    } else {
                        showStatus(`👑 Player ${data.winner_name} won!`, 'info');
                    }
                    
                    // Update prize pool
                    document.getElementById('prize-pool').textContent = `$${data.prize}`;
                }
            };
        }
        
        // Update players list
        function updatePlayersList() {
            const container = document.getElementById('players-list');
            container.innerHTML = '';
            
            players.forEach(player => {
                const badge = document.createElement('span');
                badge.className = 'player-badge';
                badge.textContent = player.name;
                
                if (player.is_winner) {
                    badge.classList.add('winner');
                    badge.textContent += ' 👑';
                }
                
                container.appendChild(badge);
            });
        }
        
        // Initialize game
        async function initGame() {
            // Generate card
            card = generateCard();
            renderCard();
            
            // Show game ID
            document.getElementById('game-id').textContent = gameId;
            
            // Connect WebSocket
            connectWebSocket();
            
            // Join game
            await fetch('/api/join-game', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    user_id: userId,
                    game_id: gameId,
                    card: card
                })
            });
        }
        
        // Start game
        initGame();
    </script>
</body>
</html>
