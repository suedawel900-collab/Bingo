<!-- templates/bingo.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK BINGO - Buy Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .user-info {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
            align-items: center;
        }
        
        .balance-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            font-size: 1.2em;
            flex: 1;
        }
        
        .balance-box .amount {
            font-size: 2em;
            font-weight: bold;
        }
        
        .user-id-box {
            background: #e9ecef;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.9em;
        }
        
        .user-id-box span {
            font-family: monospace;
            font-size: 1.2em;
            color: #667eea;
        }
        
        .back-to-bot {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
        }
        
        /* Buy Section */
        .buy-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .price-info {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
        }
        
        .price-info span {
            color: #667eea;
            font-weight: bold;
            font-size: 2em;
        }
        
        .buy-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .buy-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }
        
        .buy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .buy-multiple {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .buy-multiple-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }
        
        .buy-multiple-btn:hover {
            background: #5a6268;
        }
        
        /* Message */
        .message {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
            font-size: 1.1em;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        
        /* Cards Grid */
        .cards-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
        }
        
        .section-title {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-count {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 30px;
            font-size: 0.8em;
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .bingo-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid #667eea;
            transition: transform 0.3s;
        }
        
        .bingo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .card-number {
            font-weight: bold;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .card-date {
            font-size: 0.8em;
            color: #6c757d;
        }
        
        .bingo-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }
        
        .bingo-table th {
            color: #667eea;
            font-size: 1.2em;
            padding: 5px;
            background: #f8f9fa;
        }
        
        .bingo-table td {
            border: 1px solid #dee2e6;
            padding: 8px;
            text-align: center;
            font-weight: bold;
        }
        
        .free-space {
            background: #ffd700;
            color: #333;
        }
        
        .marked {
            background: #4CAF50;
            color: white;
        }
        
        /* Login Section */
        .login-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            margin: 50px auto;
        }
        
        .login-section h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        
        .user-id-input {
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #667eea;
            border-radius: 10px;
            width: 100%;
            margin: 10px 0;
        }
        
        .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            width: 100%;
        }
        
        .remember-me {
            margin: 15px 0;
            text-align: left;
        }
        
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        
        /* Loading Spinner */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .buy-btn {
                padding: 15px 40px;
                font-size: 1.2em;
            }
            
            .card-grid {
                grid-template-columns: 1fr;
            }
            
            .user-info {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div id="login-section" class="login-section">
            <h1>🎯 MK BINGO</h1>
            <p>Enter your Telegram User ID to access your cards</p>
            <input type="text" id="user-id" class="user-id-input" placeholder="Telegram User ID (e.g., 6975815871)">
            <label class="remember-me">
                <input type="checkbox" id="remember-me"> Remember me
            </label>
            <button onclick="login()" class="login-btn">Login</button>
            <p style="margin-top: 20px; color: #666; font-size: 0.9em;">
                Don't know your ID? Send /start to the bot and check the logs, or contact @mk_admin
            </p>
        </div>
        
        <!-- Main Content -->
        <div id="main-content" style="display: none;">
            <div class="header">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h1>🎯 MK BINGO</h1>
                    <a href="https://t.me/YOUR_BOT_USERNAME" class="back-to-bot">⬅️ Back to Bot</a>
                </div>
                
                <div class="user-info">
                    <div class="balance-box">
                        <div>Your Balance</div>
                        <div class="amount" id="balance">0 ETB</div>
                    </div>
                    <div class="user-id-box">
                        <div>User ID: <span id="display-user-id"></span></div>
                        <div>Username: <span id="display-username">Not set</span></div>
                    </div>
                    <button onclick="logout()" class="logout-btn">Logout</button>
                </div>
            </div>
            
            <!-- Buy Cards Section -->
            <div class="buy-section">
                <h2>🎮 Buy Bingo Cards</h2>
                <div class="price-info">
                    Price: <span id="card-price">10 ETB</span> per card
                </div>
                
                <button class="buy-btn" onclick="buyCard()" id="buy-btn">
                    🎲 Buy 1 Card
                </button>
                
                <div class="buy-multiple">
                    <button class="buy-multiple-btn" onclick="buyMultipleCards(3)">Buy 3 Cards</button>
                    <button class="buy-multiple-btn" onclick="buyMultipleCards(5)">Buy 5 Cards</button>
                    <button class="buy-multiple-btn" onclick="buyMultipleCards(10)">Buy 10 Cards</button>
                </div>
                
                <div id="message" class="message"></div>
                
                <div id="loading-spinner" class="spinner"></div>
            </div>
            
            <!-- My Cards Section -->
            <div class="cards-section">
                <div class="section-title">
                    <span>📊 My Bingo Cards</span>
                    <span class="card-count" id="card-count">0</span>
                </div>
                
                <div id="cards-grid" class="card-grid">
                    <!-- Cards will be loaded here -->
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Configuration
        const API_BASE = window.location.origin;
        const CARD_PRICE = 10;
        let currentUserId = null;
        
        // Check for saved login
        window.onload = function() {
            const savedUserId = localStorage.getItem('bingo_user_id');
            if (savedUserId) {
                document.getElementById('user-id').value = savedUserId;
                login();
            }
        };
        
        function showLoading(show) {
            document.getElementById('loading-spinner').style.display = show ? 'block' : 'none';
            document.getElementById('buy-btn').disabled = show;
        }
        
        function showMessage(text, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = 'message ' + type;
            
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }
        
        async function login() {
            const userId = document.getElementById('user-id').value.trim();
            
            if (!userId) {
                showMessage('Please enter your User ID', 'error');
                return;
            }
            
            // Validate that it's a number
            if (!/^\d+$/.test(userId)) {
                showMessage('User ID must be a number', 'error');
                return;
            }
            
            showLoading(true);
            currentUserId = userId;
            
            try {
                // Save if remember me is checked
                if (document.getElementById('remember-me').checked) {
                    localStorage.setItem('bingo_user_id', userId);
                }
                
                // Try to load user data
                const response = await fetch(`${API_BASE}/api/user/${userId}`);
                const data = await response.json();
                
                // Show main content
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                
                document.getElementById('display-user-id').textContent = userId;
                document.getElementById('display-username').textContent = data.username || 'Not set';
                document.getElementById('balance').textContent = data.balance + ' ETB';
                
                // Load cards
                displayCards(data.cards || []);
                
                showMessage('✅ Login successful!', 'success');
                
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Error connecting to server', 'error');
                currentUserId = null;
            } finally {
                showLoading(false);
            }
        }
        
        function logout() {
            currentUserId = null;
            localStorage.removeItem('bingo_user_id');
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('user-id').value = '';
        }
        
        async function buyCard() {
            if (!currentUserId) {
                showMessage('Please login first', 'error');
                return;
            }
            
            await purchaseCards(1);
        }
        
        async function buyMultipleCards(count) {
            if (!currentUserId) {
                showMessage('Please login first', 'error');
                return;
            }
            
            if (!confirm(`Buy ${count} cards for ${count * CARD_PRICE} ETB?`)) {
                return;
            }
            
            await purchaseCards(count);
        }
        
        async function purchaseCards(count) {
            showLoading(true);
            
            try {
                const response = await fetch(`${API_BASE}/api/buy-cards`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_id: currentUserId,
                        count: count
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`✅ Successfully bought ${count} card(s)!`, 'success');
                    
                    // Update balance
                    document.getElementById('balance').textContent = data.new_balance + ' ETB';
                    
                    // Reload all cards
                    await reloadUserData();
                } else {
                    showMessage('❌ ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Purchase error:', error);
                showMessage('Error purchasing cards', 'error');
            } finally {
                showLoading(false);
            }
        }
        
        async function reloadUserData() {
            try {
                const response = await fetch(`${API_BASE}/api/user/${currentUserId}`);
                const data = await response.json();
                
                document.getElementById('balance').textContent = data.balance + ' ETB';
                displayCards(data.cards || []);
            } catch (error) {
                console.error('Reload error:', error);
            }
        }
        
        function displayCards(cards) {
            const grid = document.getElementById('cards-grid');
            const cardCount = document.getElementById('card-count');
            
            cardCount.textContent = cards.length;
            
            if (cards.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666;">You don\'t have any cards yet. Buy your first card above!</p>';
                return;
            }
            
            grid.innerHTML = cards.map(card => renderCard(card)).join('');
        }
        
        function renderCard(card) {
            // Handle both string and object cards
            let cardData = card;
            if (typeof card === 'string') {
                try {
                    cardData = JSON.parse(card);
                } catch {
                    cardData = { id: 'New', numbers: generatePlaceholderCard() };
                }
            }
            
            const numbers = cardData.numbers || generatePlaceholderCard();
            const cardId = cardData.id || 'New';
            const purchaseDate = cardData.purchased_at ? new Date(cardData.purchased_at).toLocaleDateString() : 'Just now';
            const marked = cardData.marked || [];
            
            let html = `
                <div class="bingo-card">
                    <div class="card-header">
                        <span class="card-number">Card #${cardId}</span>
                        <span class="card-date">${purchaseDate}</span>
                    </div>
                    <table class="bingo-table">
                        <tr>
                            <th>B</th><th>I</th><th>N</th><th>G</th><th>O</th>
                        </tr>
            `;
            
            for (let row = 0; row < 5; row++) {
                html += '<tr>';
                for (let col = 0; col < 5; col++) {
                    let value = numbers[col][row];
                    let className = '';
                    
                    if (value === 'FREE') {
                        className = 'free-space';
                        value = '⭐';
                    } else if (marked.includes(value)) {
                        className = 'marked';
                    }
                    
                    html += `<td class="${className}">${value}</td>`;
                }
                html += '</tr>';
            }
            
            html += '</table></div>';
            return html;
        }
        
        function generatePlaceholderCard() {
            // Generate a simple placeholder card
            const card = [];
            for (let col = 0; col < 5; col++) {
                const colNumbers = [];
                for (let row = 0; row < 5; row++) {
                    if (col === 2 && row === 2) {
                        colNumbers.push('FREE');
                    } else {
                        colNumbers.push(Math.floor(Math.random() * 15) + 1 + col * 15);
                    }
                }
                card.push(colNumbers);
            }
            return card;
        }
        
        // Auto-refresh every 30 seconds
        setInterval(() => {
            if (currentUserId) {
                reloadUserData();
            }
        }, 30000);
    </script>
</body>
</html>
